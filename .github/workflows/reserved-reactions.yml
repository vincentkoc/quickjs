{
  "name": "Async generator reentry qualification",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "64cb82cfdfc73ea67e90c29e73c357263babaa89",
            "fetch-depth": 40
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1"
          }
        },
        {
          "name": "Release suites, Node control and isolated parent cases",
          "shell": "bash",
          "run": "set -euo pipefail\nsha256sum quickjs.c tests/async-generator-resolver-reentry.js\ncmake -S . -B \"$RUNNER_TEMP/candidate\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/candidate\" -j2\n\"$RUNNER_TEMP/candidate/api-test\"\n\"$RUNNER_TEMP/candidate/run-test262\" -c tests.conf\nnode tests/async-generator-resolver-reentry.js\necho REENTRY_CANDIDATE_NODE_SUITES_PASS\ngit show d1cef1501a841cda4330d9b4abeb593dd019a686:quickjs.c > quickjs.c\ncmake -S . -B \"$RUNNER_TEMP/baseline\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/baseline\" --target qjs -j2\nulimit -c 0\npython3 <<'PY'\nfrom pathlib import Path\nimport subprocess,os,json\nsource=Path('tests/async-generator-resolver-reentry.js').read_text()\nrows=[]\nfor mode in range(8):\n s=source.replace('[false, true]',str([mode>=3]).lower(),1) if mode<6 else source.replace('[false, true]','[]',1)\n s=s.replace('[\"next\", \"return\", \"throw\"]',json.dumps([[\"next\",\"return\",\"throw\"][mode%3]]),1) if mode<6 else s\n s=s.replace('for (const rejected of [false, true])', 'for (const rejected of '+(str([mode==7]).lower() if mode>=6 else '[]')+')')\n s=s.replace('assert(await testReentry(), 8);','assert(await testReentry(), 1);')\n path=Path('tests/reentry-selected.mjs');path.write_text(s)\n p=subprocess.run([os.environ['RUNNER_TEMP']+'/baseline/qjs','-m',str(path)],capture_output=True,text=True,timeout=30)\n rows.append({'mode':mode,'exit':p.returncode,'assertion':next((line for line in p.stderr.splitlines() if 'assertion failed' in line),'')})\npath.unlink()\nprint('REENTRY_PARENT_CONTROLS',json.dumps(rows))\nassert rows[0]['exit']!=0 and rows[3]['exit']!=0,rows\nPY\necho REENTRY_NATIVE_DONE\n"
        }
      ]
    },
    "sanitizers": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "64cb82cfdfc73ea67e90c29e73c357263babaa89",
            "fetch-depth": 40
          }
        },
        {
          "name": "ASan UBSan suites",
          "shell": "bash",
          "run": "set -euo pipefail\ncmake -S . -B \"$RUNNER_TEMP/build\" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQJS_ENABLE_ASAN=ON -DQJS_ENABLE_UBSAN=ON\ncmake --build \"$RUNNER_TEMP/build\" -j2\n\"$RUNNER_TEMP/build/api-test\"\n\"$RUNNER_TEMP/build/run-test262\" -c tests.conf\necho REENTRY_SANITIZED_PASS\n"
        }
      ]
    },
    "native-cost": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "64cb82cfdfc73ea67e90c29e73c357263babaa89",
            "fetch-depth": 40
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1"
          }
        },
        {
          "name": "Six successful lifecycle costs",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/native-cost.c\" <<'C'\n#ifdef NDEBUG\n#undef NDEBUG\n#endif\n#include <assert.h>\n#include <stdio.h>\n#include <string.h>\n#include <time.h>\n#include <sys/resource.h>\n#include \"quickjs.h\"\nstatic double now(clockid_t id){struct timespec t;assert(!clock_gettime(id,&t));return t.tv_sec*1000.0+t.tv_nsec/1e6;}\nint main(void){const int N=1000,W=200,T=80;const char *names[]={\"completed-next\",\"yield\",\"await-return\",\"completed-return\",\"promise-control\",\"queued-yields\"},*sources[]={\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++)(async function*(){})().next().then(r=>{seen++;good+=r.done===true&&r.value===undefined})}\",\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++)(async function*(){yield 1})().next().then(r=>{seen++;good+=r.done===false&&r.value===1})}\",\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++)(async function*(){await 0})().next().then(r=>{seen++;good+=r.done===true&&r.value===undefined})}\",\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++)(async function*(){})().return(1).then(r=>{seen++;good+=r.done===true&&r.value===1})}\",\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++)Promise.resolve(1).then(r=>{seen++;good+=r===1})}\",\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++){const g=(async function*(){yield 1;yield 2})();Promise.all([g.next(),g.next()]).then(r=>{seen++;good+=r[0].value===1&&r[0].done===false&&r[1].value===2&&r[1].done===false})}}\"};printf(\"{\\\"n\\\":%d,\\\"warm\\\":%d,\\\"timed\\\":%d,\\\"rows\\\":[\",N,W,T);\nfor(int k=0;k<6;k++){JSRuntime*rt=JS_NewRuntime();assert(rt);JS_SetDumpFlags(rt,JS_ABORT_ON_LEAKS);JSContext*ctx=JS_NewContext(rt),*jobctx;assert(ctx);JSValue fn=JS_Eval(ctx,sources[k],strlen(sources[k]),\"<cost>\",0),n=JS_NewInt32(ctx,N);assert(!JS_IsException(fn));int expected=-1;printf(\"%s{\\\"kind\\\":\\\"%s\\\",\\\"samples\\\":[\",k?\",\":\"\",names[k]);for(int r=-W;r<T;r++){double c=now(CLOCK_PROCESS_CPUTIME_ID),t=now(CLOCK_MONOTONIC);JSValue ret=JS_Call(ctx,fn,JS_UNDEFINED,1,(JSValueConst*)&n);assert(!JS_IsException(ret));JS_FreeValue(ctx,ret);int jobs=0,j;while((j=JS_ExecutePendingJob(rt,&jobctx))>0){assert(jobctx==ctx);jobs++;}assert(j==0);ret=JS_Eval(ctx,\"seen===1000&&good===1000\",strlen(\"seen===1000&&good===1000\"),\"<check>\",0);assert(JS_IsBool(ret)&&JS_VALUE_GET_BOOL(ret));JS_FreeValue(ctx,ret);double wall=now(CLOCK_MONOTONIC)-t,cpu=now(CLOCK_PROCESS_CPUTIME_ID)-c;assert(!JS_HasException(ctx));if(expected<0)expected=jobs;assert(expected==jobs);if(r>=0)printf(\"%s{\\\"wallMs\\\":%.9f,\\\"cpuMs\\\":%.9f}\",r?\",\":\"\",wall,cpu);}printf(\"],\\\"jobs\\\":%d}\",expected);JS_FreeValue(ctx,fn);JS_FreeValue(ctx,n);JS_FreeContext(ctx);JS_RunGC(rt);JSMemoryUsage u;JS_ComputeMemoryUsage(rt,&u);assert(u.obj_count==0);JS_FreeRuntime(rt);}struct rusage u;assert(!getrusage(RUSAGE_SELF,&u));printf(\"],\\\"maxRssKiB\\\":%ld,\\\"compiler\\\":\\\"%s\\\"}\\n\",u.ru_maxrss,__VERSION__);}\n\nC\ncat > \"$RUNNER_TEMP/cost-runner.mjs\" <<'JS'\nimport assert from'node:assert/strict';import{execFileSync}from'node:child_process';import{readFileSync}from'node:fs';import{createHash}from'node:crypto';import{cpus,loadavg,freemem}from'node:os';\nconst mode=process.argv[2],tmp=process.env.RUNNER_TEMP,results=[],hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');for(let pair=0;pair<5;pair++)for(const arm of pair%2?['candidate','baseline']:['baseline','candidate']){const start={load:loadavg(),freeMemoryBytes:freemem()};let r;if(mode==='native'){const exe=tmp+'/'+arm+'-cost';r=JSON.parse(execFileSync(exe,[],{encoding:'utf8',timeout:300000,maxBuffer:2*1024*1024}));Object.assign(r,{arm,pair,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},executableSha256:hash(exe),probeSha256:hash(tmp+'/native-cost.c')});}else r=JSON.parse(execFileSync(process.execPath,[tmp+'/generator-cost.mjs',tmp+'/wasi-dist',tmp+'/'+arm+'.wasm',arm,String(pair)],{encoding:'utf8',timeout:300000,maxBuffer:2*1024*1024}));results.push(r);console.log('GENERATOR_'+mode.toUpperCase()+'_RAW',JSON.stringify(r));}\nfor(const r of results){assert.equal(r.probeSha256,results[0].probeSha256);assert.equal(r.warm,200);assert.equal(r.timed,80);assert.equal(r.n,1000);assert.equal(r.rows.length,6);for(const row of r.rows){assert.equal(row.jobs,({'completed-next':1000,'yield':2000,'await-return':2000,'completed-return':2000,'promise-control':1000,'queued-yields':5000})[row.kind]);assert.equal(row.samples.length,80);assert.equal(row.jobs,results[0].rows.find(x=>x.kind===row.kind).jobs);for(const s of row.samples)assert(Number.isFinite(s.wallMs)&&s.wallMs>0&&Number.isFinite(s.cpuMs)&&s.cpuMs>0);}}\nconst median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)],p95=a=>[...a].sort((a,b)=>a-b)[Math.ceil(a.length*.95)-1];console.log('GENERATOR_'+mode.toUpperCase()+'_SUMMARY',JSON.stringify(results[0].rows.map(row=>({kind:row.kind,pairs:Array.from({length:5},(_,pair)=>{const arms=Object.fromEntries(results.filter(r=>r.pair===pair).map(r=>[r.arm,r.rows.find(x=>x.kind===row.kind).samples]));const metrics=Object.fromEntries(Object.entries(arms).map(([arm,a])=>[arm,{wallMedianMs:median(a.map(s=>s.wallMs)),cpuMedianMs:median(a.map(s=>s.cpuMs)),wallP95Ms:p95(a.map(s=>s.wallMs)),earlyMedianMs:median(a.slice(0,20).map(s=>s.wallMs)),lateMedianMs:median(a.slice(-20).map(s=>s.wallMs))}]));return{pair,arms:metrics,wallRatio:metrics.candidate.wallMedianMs/metrics.baseline.wallMedianMs,cpuRatio:metrics.candidate.cpuMedianMs/metrics.baseline.cpuMedianMs};})}))));\n\nJS\ncmake -S . -B \"$RUNNER_TEMP/cost-candidate\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/cost-candidate\" --target qjs -j2\ncc -O3 -I . \"$RUNNER_TEMP/native-cost.c\" \"$RUNNER_TEMP/cost-candidate/libqjs.a\" -lm -ldl -lpthread -o \"$RUNNER_TEMP/candidate-cost\"\ngit show d1cef1501a841cda4330d9b4abeb593dd019a686:quickjs.c > quickjs.c\ncmake -S . -B \"$RUNNER_TEMP/cost-baseline\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/cost-baseline\" --target qjs -j2\ncc -O3 -I . \"$RUNNER_TEMP/native-cost.c\" \"$RUNNER_TEMP/cost-baseline/libqjs.a\" -lm -ldl -lpthread -o \"$RUNNER_TEMP/baseline-cost\"\nnode \"$RUNNER_TEMP/cost-runner.mjs\" native\n"
        }
      ]
    },
    "wasi": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "64cb82cfdfc73ea67e90c29e73c357263babaa89",
            "fetch-depth": 40,
            "path": "ng-source"
          }
        },
        {
          "name": "Extract production layers",
          "shell": "bash",
          "run": "set -euo pipefail\ngit -C ng-source diff d7215b0ad3fc2c562e8317fd9bca058fd4863804 d1cef1501a841cda4330d9b4abeb593dd019a686 -- quickjs.c > \"$RUNNER_TEMP/parent.patch\"\ngit -C ng-source diff d1cef1501a841cda4330d9b4abeb593dd019a686 64cb82cfdfc73ea67e90c29e73c357263babaa89 -- quickjs.c > \"$RUNNER_TEMP/reentry.patch\"\nsha256sum \"$RUNNER_TEMP/parent.patch\" \"$RUNNER_TEMP/reentry.patch\"\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "vincentkoc/quickjs-wasi",
            "ref": "6a9bb60e52314f843c7f52f1723b713024681338",
            "path": "wasi",
            "submodules": "recursive",
            "fetch-depth": 32
          }
        },
        {
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "10.30.3"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1",
            "cache": "pnpm",
            "cache-dependency-path": "wasi/pnpm-lock.yaml"
          }
        },
        {
          "name": "Both pinned wrapper suites",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\ntest \"$(git -C quickjs-ng rev-parse HEAD)\" = 6d46d07d04041b40f4f49eaa7fdebe44c314c699\npnpm install --frozen-lockfile\nmake setup\ngit -C quickjs-ng apply --check \"$RUNNER_TEMP/parent.patch\"\ngit -C quickjs-ng apply \"$RUNNER_TEMP/parent.patch\"\nfor arm in baseline candidate; do\n if [ \"$arm\" = candidate ]; then\n  git -C quickjs-ng apply --check \"$RUNNER_TEMP/reentry.patch\"\n  git -C quickjs-ng apply \"$RUNNER_TEMP/reentry.patch\"\n fi\n pnpm run build\n cp quickjs.wasm \"$RUNNER_TEMP/$arm.wasm\"\n sha256sum quickjs.wasm dist/index.js\n pnpm test --reporter=json --outputFile=\"$RUNNER_TEMP/$arm-suite.json\"\n ARM=\"$arm\" node --input-type=module <<'JS'\nimport assert from'node:assert/strict';import{readFileSync}from'node:fs';const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/'+process.env.ARM+'-suite.json'));console.log('REENTRY_WASI_SUITE',JSON.stringify({arm:process.env.ARM,passed:r.numPassedTests,failed:r.numFailedTests,files:r.testResults.length}));assert.equal(r.numFailedTests,0);assert.equal(r.numPassedTests,2076);\nJS\ndone\ncp -R dist \"$RUNNER_TEMP/wasi-dist\"\n"
        },
        {
          "name": "Real WASI reentry witness",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/reentry-proof.mjs\" <<'JS'\nimport assert from'node:assert/strict';import{readFileSync}from'node:fs';import{pathToFileURL}from'node:url';import{createHash}from'node:crypto';\nconst tmp=process.env.RUNNER_TEMP,{QuickJS}=await import(pathToFileURL(tmp+'/wasi-dist/index.js')),hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex'),helpers=readFileSync('ng-source/tests/assert.js','utf8').replace(/^export /gm,''),source=readFileSync('ng-source/tests/async-generator-resolver-reentry.js','utf8').replace(/^import .*;\\n/,'').replace('assert(await testReentry(), 8);','testReentry();');\nfor(const arm of['baseline','candidate']){using vm=await QuickJS.create({wasm:await WebAssembly.compile(readFileSync(tmp+'/'+arm+'.wasm')),memoryLimit:16*1024*1024});using p=vm.evalCode(helpers+'\\n'+source);const jobs=vm.executePendingJobs();const result=await vm.resolvePromise(p),state=p.promiseState;let value,error;if('value'in result){using h=result.value;value=h.toNumber();}else{using h=result.error;error=h.toString();}console.log('REENTRY_WASI_CONTROL',JSON.stringify({arm,jobs,state,value,error,wasmSha256:hash(tmp+'/'+arm+'.wasm'),moduleSha256:hash(tmp+'/wasi-dist/index.js')}));if(arm==='candidate'){assert.equal(state,1);assert.equal(value,8);}else{assert.equal(state,2);assert.match(error,/assertion failed/);}}\nconsole.log('REENTRY_WASI_PROBE_SHA256',hash(process.argv[1]));\nJS\nnode \"$RUNNER_TEMP/reentry-proof.mjs\"\n"
        },
        {
          "name": "Six paired WASI lifecycle costs",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/generator-cost.mjs\" <<'JS'\nimport assert from 'node:assert/strict';import{readFileSync}from'node:fs';import{pathToFileURL}from'node:url';import{createHash}from'node:crypto';import{cpus,loadavg,freemem}from'node:os';\nconst [dir,path,arm,pair]=process.argv.slice(2),{QuickJS}=await import(pathToFileURL(dir+'/index.js')),wasm=await WebAssembly.compile(readFileSync(path));const N=1000,W=200,T=80,rows=[],sources={\"completed-next\":\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++)(async function*(){})().next().then(r=>{seen++;good+=r.done===true&&r.value===undefined})}\",\"yield\":\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++)(async function*(){yield 1})().next().then(r=>{seen++;good+=r.done===false&&r.value===1})}\",\"await-return\":\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++)(async function*(){await 0})().next().then(r=>{seen++;good+=r.done===true&&r.value===undefined})}\",\"completed-return\":\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++)(async function*(){})().return(1).then(r=>{seen++;good+=r.done===true&&r.value===1})}\",\"promise-control\":\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++)Promise.resolve(1).then(r=>{seen++;good+=r===1})}\"};\nsources['queued-yields']=\"(n)=>{globalThis.seen=0;globalThis.good=0;for(let i=0;i<n;i++){const g=(async function*(){yield 1;yield 2})();Promise.all([g.next(),g.next()]).then(r=>{seen++;good+=r[0].value===1&&r[0].done===false&&r[1].value===2&&r[1].done===false})}}\";\nfor(const[kind,code]of Object.entries(sources)){using vm=await QuickJS.create({wasm,memoryLimit:64*1024*1024});using fn=vm.evalCode(code);using n=vm.newNumber(N);let expectedJobs;const samples=[];for(let round=-W;round<T;round++){const cpu=process.cpuUsage(),at=performance.now();vm.callFunction(fn,vm.undefined,n).dispose();const jobs=vm.executePendingJobs();using check=vm.evalCode('seen===1000&&good===1000');assert.equal(check.toBoolean(),true);const wallMs=performance.now()-at,c=process.cpuUsage(cpu),cpuMs=(c.user+c.system)/1000;if(expectedJobs===undefined)expectedJobs=jobs;assert.equal(jobs,expectedJobs);assert.equal(vm.executePendingJobs(),0);if(round>=0)samples.push({wallMs,cpuMs});}rows.push({kind,jobs:expectedJobs,samples,memory:vm.getMemoryUsage(),wasmBytes:vm._getExports().memory.buffer.byteLength});}\nconst hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');console.log(JSON.stringify({arm,pair:Number(pair),rows,n:N,warm:W,timed:T,node:process.version,cpu:cpus()[0]?.model,load:loadavg(),resourceUsage:process.resourceUsage(),wasmSha256:hash(path),moduleSha256:hash(dir+'/index.js'),probeSha256:hash(process.argv[1])}));\n\nJS\ncat > \"$RUNNER_TEMP/cost-runner.mjs\" <<'JS'\nimport assert from'node:assert/strict';import{execFileSync}from'node:child_process';import{readFileSync}from'node:fs';import{createHash}from'node:crypto';import{cpus,loadavg,freemem}from'node:os';\nconst mode=process.argv[2],tmp=process.env.RUNNER_TEMP,results=[],hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');for(let pair=0;pair<5;pair++)for(const arm of pair%2?['candidate','baseline']:['baseline','candidate']){const start={load:loadavg(),freeMemoryBytes:freemem()};let r;if(mode==='native'){const exe=tmp+'/'+arm+'-cost';r=JSON.parse(execFileSync(exe,[],{encoding:'utf8',timeout:300000,maxBuffer:2*1024*1024}));Object.assign(r,{arm,pair,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},executableSha256:hash(exe),probeSha256:hash(tmp+'/native-cost.c')});}else r=JSON.parse(execFileSync(process.execPath,[tmp+'/generator-cost.mjs',tmp+'/wasi-dist',tmp+'/'+arm+'.wasm',arm,String(pair)],{encoding:'utf8',timeout:300000,maxBuffer:2*1024*1024}));results.push(r);console.log('GENERATOR_'+mode.toUpperCase()+'_RAW',JSON.stringify(r));}\nfor(const r of results){assert.equal(r.probeSha256,results[0].probeSha256);assert.equal(r.warm,200);assert.equal(r.timed,80);assert.equal(r.n,1000);assert.equal(r.rows.length,6);for(const row of r.rows){assert.equal(row.jobs,({'completed-next':1000,'yield':2000,'await-return':2000,'completed-return':2000,'promise-control':1000,'queued-yields':5000})[row.kind]);assert.equal(row.samples.length,80);assert.equal(row.jobs,results[0].rows.find(x=>x.kind===row.kind).jobs);for(const s of row.samples)assert(Number.isFinite(s.wallMs)&&s.wallMs>0&&Number.isFinite(s.cpuMs)&&s.cpuMs>0);}}\nconst median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)],p95=a=>[...a].sort((a,b)=>a-b)[Math.ceil(a.length*.95)-1];console.log('GENERATOR_'+mode.toUpperCase()+'_SUMMARY',JSON.stringify(results[0].rows.map(row=>({kind:row.kind,pairs:Array.from({length:5},(_,pair)=>{const arms=Object.fromEntries(results.filter(r=>r.pair===pair).map(r=>[r.arm,r.rows.find(x=>x.kind===row.kind).samples]));const metrics=Object.fromEntries(Object.entries(arms).map(([arm,a])=>[arm,{wallMedianMs:median(a.map(s=>s.wallMs)),cpuMedianMs:median(a.map(s=>s.cpuMs)),wallP95Ms:p95(a.map(s=>s.wallMs)),earlyMedianMs:median(a.slice(0,20).map(s=>s.wallMs)),lateMedianMs:median(a.slice(-20).map(s=>s.wallMs))}]));return{pair,arms:metrics,wallRatio:metrics.candidate.wallMedianMs/metrics.baseline.wallMedianMs,cpuRatio:metrics.candidate.cpuMedianMs/metrics.baseline.cpuMedianMs};})}))));\n\nJS\nnode \"$RUNNER_TEMP/cost-runner.mjs\" wasi\n"
        }
      ]
    }
  }
}
