{
  "name": "Final host Promise allocator and matched cost qualification",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "wasi": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "fc8e21a7bfa76182639fbe4667864c6cf1c89499",
            "fetch-depth": 16,
            "path": "ng-source"
          }
        },
        {
          "name": "Extract only native production layers",
          "shell": "bash",
          "run": "set -euo pipefail\ngit -C ng-source diff d7215b0ad3fc2c562e8317fd9bca058fd4863804 678c0404f70613129059bd17d1c847ab9b5c2590 -- quickjs.c > \"$RUNNER_TEMP/parent.patch\"\ngit -C ng-source diff 678c0404f70613129059bd17d1c847ab9b5c2590 fc8e21a7bfa76182639fbe4667864c6cf1c89499 -- quickjs.c > \"$RUNNER_TEMP/reserved.patch\"\nsha256sum \"$RUNNER_TEMP/\"*.patch\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "vincentkoc/quickjs-wasi",
            "ref": "6a9bb60e52314f843c7f52f1723b713024681338",
            "path": "wasi",
            "submodules": "recursive",
            "fetch-depth": 32
          }
        },
        {
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "10.30.3"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1",
            "cache": "pnpm",
            "cache-dependency-path": "wasi/pnpm-lock.yaml"
          }
        },
        {
          "name": "Build matched wrappers over repaired native engine",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\npnpm install --frozen-lockfile\nmake setup\ngit -C quickjs-ng apply --check \"$RUNNER_TEMP/parent.patch\"\ngit -C quickjs-ng apply \"$RUNNER_TEMP/parent.patch\"\ngit -C quickjs-ng apply --check \"$RUNNER_TEMP/reserved.patch\"\ngit -C quickjs-ng apply \"$RUNNER_TEMP/reserved.patch\"\npnpm run build\ncp quickjs.wasm \"$RUNNER_TEMP/patched.wasm\"\ncp -R dist \"$RUNNER_TEMP/candidate-dist\"\ngit show bd88c9645948247ff5c3cfc7c10eeefc3b51f8c2:src/index.ts > src/index.ts\npnpm run build:ts\ncp -R dist \"$RUNNER_TEMP/baseline-dist\"\ngit restore --source=HEAD src/index.ts\nsha256sum \"$RUNNER_TEMP/patched.wasm\" \"$RUNNER_TEMP/\"*-dist/index.js\n"
        },
        {
          "name": "Real allocator failure after early subscriber success",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/host-bridge-proof.mjs\" <<'JS'\nimport assert from'node:assert/strict';import{readFileSync}from'node:fs';import{pathToFileURL}from'node:url';import{createHash}from'node:crypto';\nconst tmp=process.env.RUNNER_TEMP,wasm=await WebAssembly.compile(readFileSync(tmp+'/patched.wasm')),rows=[];\nfor(const arm of ['baseline','candidate']){\n const{QuickJS,JSException}=await import(pathToFileURL(tmp+'/'+arm+'-dist/index.js'));\n using vm=await QuickJS.create({wasm,memoryLimit:16*1024*1024});void vm.undefined;void vm.true;\n let signal,reaction;const source=new Promise(resolve=>{signal=resolve}),then=source.then.bind(source);\n source.then=(...args)=>{reaction=then(...args);void reaction.catch(()=>{});return reaction};\n using guest=vm.hostToHandle(source);vm.global.setProp('bridged',guest);\n const observed=[];const watch=promise=>{const outcomes=[];observed.push(outcomes);void promise.then(result=>{outcomes.push({status:'fulfilled'});if(result)('value'in result?result.value:result.error).dispose()},error=>outcomes.push({status:'rejected',error}));return outcomes};\n const direct=watch(vm.resolvePromise(guest));let bodies=0;\n using effect=vm.newFunction('effect',()=>{bodies++;return vm.undefined});vm.global.setProp('effect',effect);\n vm.evalCode('globalThis.t={then(r){effect();r(true)}};globalThis.promises=[];for(let i=0;i<2048;i++)promises.push((async()=>{await bridged;return t})())').dispose();\n using derived=vm.evalCode('promises[0]');watch(vm.resolvePromise(derived));\n const deferred=vm.newPromise();using pending=deferred.handle;watch(deferred.settled);\n const e=vm._getExports();let nativeFailures=0,jobs=0;const reasons=[];\n vm.exports={...e,qjs_execute_pending_job(){const r=e.qjs_execute_pending_job();jobs++;if(r<0)nativeFailures++;return r},qjs_get_exception(){const ptr=e.qjs_get_exception();reasons.push(e.qjs_typeof(ptr));return ptr}};\n let terminal,rootStateBeforeDispose,pendingWaiters;const dispose=vm.dispose.bind(vm);\n vm.dispose=()=>{if(!(vm._getExports() === null)&&vm.asyncFailure){terminal=vm.asyncFailure.error;rootStateBeforeDispose=e.qjs_promise_state(guest.ptr);pendingWaiters=vm.promiseWaiters.size}dispose()};\n e.qjs_set_memory_limit(131073);signal(true);\n let reactionStatus,detached;await reaction.then(()=>{reactionStatus='fulfilled'},error=>{reactionStatus='rejected';detached=error});await Promise.resolve();await Promise.resolve();\n const disposed=(vm._getExports() === null);\n console.log('HOST_BRIDGE_ALLOCATOR_PHASE',JSON.stringify({arm,disposed,jobs,nativeFailures,reasons,reactionStatus,outcomes:observed.map(a=>a.map(r=>r.status))}));\n assert.equal(nativeFailures,1);assert.equal(bodies,0);\n if(arm==='candidate'){\n  assert.equal(disposed,true);assert.equal(reactionStatus,'fulfilled');assert(terminal instanceof JSException);assert.equal(rootStateBeforeDispose,1);assert.equal(pendingWaiters,3);\n  assert(observed.every(a=>a.length===1&&a[0].status==='rejected'&&a[0].error===terminal));assert.equal(vm.promiseWaiters.size,0);assert.equal(vm._getExports(),null);\n  let late;try{vm.resolvePromise(guest)}catch(error){late=error}assert.equal(late,terminal);\n }else{\n  assert.equal(disposed,false);assert.equal(reactionStatus,'rejected');assert.equal(direct[0]?.status,'fulfilled');assert.equal(observed[1].length,0);assert.equal(observed[2].length,0);e.qjs_set_memory_limit(16*1024*1024);\n }\n rows.push({arm,preparedAsyncResumers:2048,cap:131073,disposed,jobs,nativeFailures,nativeReasonTypes:reasons,reactionStatus,cachedMessage:(terminal??detached)?.message,rootStateBeforeDispose,pendingWaiters,observerStatuses:observed.map(a=>a.map(r=>r.status)),thenBodies:bodies});\n}\nconsole.log('HOST_BRIDGE_ALLOCATOR',JSON.stringify({rows,probeSha256:createHash('sha256').update(readFileSync(process.argv[1])).digest('hex')}));\nJS\nnode \"$RUNNER_TEMP/host-bridge-proof.mjs\"\n"
        },
        {
          "name": "Strict Node processes for abandoned observers and late completions",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/strict-host-child.mjs\" <<'JS'\nimport assert from'node:assert/strict';import{readFileSync}from'node:fs';import{pathToFileURL}from'node:url';\nconst[dir,wasmPath,phase]=process.argv.slice(2),{QuickJS}=await import(pathToFileURL(dir+'/index.js'));\nusing vm=await QuickJS.create(readFileSync(wasmPath));let ok,fail;\nconst source=new Promise((resolve,reject)=>{ok=resolve;fail=reject});\nconst deferred=vm.newPromise();using pending=deferred.handle;\nusing guest=phase==='observers'?pending.dup():vm.hostToHandle(source);\nvoid vm.resolvePromise(guest);void deferred.settled;\nif(phase==='terminal-abandoned')vm.executePendingJobs=()=>{throw new Error('drain failure')};else vm.dispose();\nif(phase==='late-reject')fail(new Error('late'));else ok(true);\nawait new Promise(resolve=>setTimeout(resolve,20));assert.equal((vm._getExports() === null),true);\nconsole.log('STRICT_CHILD_PASS',phase);\nJS\nnode --input-type=module <<'JS'\nimport assert from'node:assert/strict';import{spawnSync}from'node:child_process';\nconst tmp=process.env.RUNNER_TEMP,rows=[];\nfor(const arm of ['baseline','candidate'])for(const phase of ['observers','late-fulfill','late-reject','terminal-abandoned']){\n const p=spawnSync(process.execPath,['--unhandled-rejections=strict',tmp+'/strict-host-child.mjs',tmp+'/'+arm+'-dist',tmp+'/patched.wasm',phase],{encoding:'utf8',timeout:30000});\n const expected=arm==='baseline'&&phase!=='observers'?1:0;assert.equal(p.status,expected,p.stderr);if(expected===0)assert(p.stdout.includes('STRICT_CHILD_PASS'));\n rows.push({arm,phase,exit:p.status,stderr:p.stderr.split('\\n').slice(0,6).join('\\n')});\n}\nconsole.log('HOST_BRIDGE_STRICT_PROCESSES',JSON.stringify(rows));\nJS\n"
        },
        {
          "name": "Matched host-bridge and observer lifecycle cost",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/host-bridge-cost.mjs\" <<'JS'\nimport assert from'node:assert/strict';import{readFileSync}from'node:fs';import{pathToFileURL}from'node:url';import{createHash}from'node:crypto';import{cpus,loadavg,freemem}from'node:os';\nconst[dir,wasmPath,arm,pair]=process.argv.slice(2),{QuickJS}=await import(pathToFileURL(dir+'/index.js')),wasm=await WebAssembly.compile(readFileSync(wasmPath));\nconst hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex'),N=250,rows=[],start={load:loadavg(),freeMemoryBytes:freemem()};\nfor(const kind of ['host-resolve','host-reject','deferred-settled','resolve-settled','deferred-control']){\n using vm=await QuickJS.create({wasm,memoryLimit:32*1024*1024});void vm.undefined;void vm.true;using settled=vm.evalCode('Promise.resolve(1)');const samples=[];\n for(let round=-1000;round<200;round++){\n  const handles=[],promises=[];const cpu=process.cpuUsage(),at=performance.now();\n  for(let i=0;i<N;i++){\n   if(kind==='host-resolve'||kind==='host-reject'){\n    const h=vm.hostToHandle(kind==='host-resolve'?Promise.resolve(i):Promise.reject(i));handles.push(h);promises.push(vm.resolvePromise(h));\n   }else if(kind==='resolve-settled')promises.push(vm.resolvePromise(settled));\n   else{const d=vm.newPromise();if(kind==='deferred-settled')promises.push(d.settled);d.resolve(vm.true);handles.push(d.handle)}\n  }\n  if(kind==='deferred-settled')assert.equal(vm.executePendingJobs(),N);\n  const results=await Promise.all(promises);\n  for(let i=0;i<results.length;i++){const r=results[i];if(r){assert.equal('value'in r,kind!=='host-reject');const h='value'in r?r.value:r.error;assert.equal(h.toNumber(),kind==='resolve-settled'?1:i);h.dispose()}}\n  for(const h of handles){assert.equal(h.promiseState,kind==='host-reject'?2:1);h.dispose()}\n  const wallMs=performance.now()-at,c=process.cpuUsage(cpu),cpuMs=(c.user+c.system)/1000;\n  assert.equal(vm.executePendingJobs(),0);using error=vm.getException();assert.equal(vm._getExports().qjs_typeof(error.ptr),4);assert.equal(vm._ownedHandles.size,0);assert.equal(vm.hostCallbacks.size,0);if(vm.promiseWaiters)assert.equal(vm.promiseWaiters.size,0);\n  if(round>=0)samples.push({wallMs,cpuMs});\n }\n rows.push({kind,samples,memory:vm.getMemoryUsage(),wasmBytes:vm._getExports().memory.buffer.byteLength});\n}\nconsole.log(JSON.stringify({arm,pair:Number(pair),rows,n:N,warm:1000,timed:200,probeSha256:hash(process.argv[1]),wasmSha256:hash(wasmPath),moduleSha256:hash(dir+'/index.js'),node:process.version,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},resourceUsage:process.resourceUsage()}));\nJS\ncat > \"$RUNNER_TEMP/cost-runner.mjs\" <<'JS'\nimport assert from 'node:assert/strict';\nimport {execFileSync} from 'node:child_process';\nimport {readFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport {cpus,loadavg,freemem} from 'node:os';\nconst mode=process.argv[2],tmp=process.env.RUNNER_TEMP,results=[];\nconst hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');\nfor(let pair=0;pair<5;pair++)for(const arm of pair%2?['candidate','baseline']:['baseline','candidate']){\n  const start={load:loadavg(),freeMemoryBytes:freemem()};\n  let r;\n  if(mode==='native'){\n    const exe=tmp+'/'+arm+'-cost';\n    r=JSON.parse(execFileSync(exe,[],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n    Object.assign(r,{arm,pair,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},executableSha256:hash(exe),probeSha256:hash(tmp+'/native-cost.c')});\n  }else r=JSON.parse(execFileSync(process.execPath,[tmp+'/host-bridge-cost.mjs',tmp+'/'+arm+'-dist',tmp+'/patched.wasm',arm,String(pair)],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n  results.push(r);console.log('HOST_BRIDGE_'+mode.toUpperCase()+'_RAW',JSON.stringify(r));\n}\nfor(const r of results){\n  assert.equal(r.probeSha256,results[0].probeSha256);\n  for(const row of r.rows){assert.equal(row.samples.length,200);for(const s of row.samples)assert(Number.isFinite(s.wallMs)&&s.wallMs>0&&Number.isFinite(s.cpuMs)&&s.cpuMs>0);}\n}\nconst median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)],p95=a=>[...a].sort((a,b)=>a-b)[Math.ceil(a.length*.95)-1];\nconsole.log('HOST_BRIDGE_'+mode.toUpperCase()+'_SUMMARY',JSON.stringify(results[0].rows.map(row=>({kind:row.kind,pairs:Array.from({length:5},(_,pair)=>{\n  const arms=Object.fromEntries(results.filter(r=>r.pair===pair).map(r=>[r.arm,r.rows.find(x=>x.kind===row.kind).samples]));\n  const metrics=Object.fromEntries(Object.entries(arms).map(([arm,a])=>[arm,{wallMedianMs:median(a.map(s=>s.wallMs)),cpuMedianMs:median(a.map(s=>s.cpuMs)),wallP95Ms:p95(a.map(s=>s.wallMs)),earlyMedianMs:median(a.slice(0,50).map(s=>s.wallMs)),lateMedianMs:median(a.slice(-50).map(s=>s.wallMs))}]));\n  return{pair,arms:metrics,wallRatio:metrics.candidate.wallMedianMs/metrics.baseline.wallMedianMs,cpuRatio:metrics.candidate.cpuMedianMs/metrics.baseline.cpuMedianMs};\n})}))));\n\nJS\nnode \"$RUNNER_TEMP/cost-runner.mjs\" wasi\n"
        }
      ]
    }
  }
}
