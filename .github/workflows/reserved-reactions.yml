{
  "name": "Deferred allocator and wrapper cost qualification",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "wasi": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "fc8e21a7bfa76182639fbe4667864c6cf1c89499",
            "fetch-depth": 16,
            "path": "ng-source"
          }
        },
        {
          "name": "Extract only native production layers",
          "shell": "bash",
          "run": "set -euo pipefail\ngit -C ng-source diff d7215b0ad3fc2c562e8317fd9bca058fd4863804 678c0404f70613129059bd17d1c847ab9b5c2590 -- quickjs.c > \"$RUNNER_TEMP/parent.patch\"\ngit -C ng-source diff 678c0404f70613129059bd17d1c847ab9b5c2590 fc8e21a7bfa76182639fbe4667864c6cf1c89499 -- quickjs.c > \"$RUNNER_TEMP/reserved.patch\"\nsha256sum \"$RUNNER_TEMP/\"*.patch\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "vincentkoc/quickjs-wasi",
            "ref": "bd88c9645948247ff5c3cfc7c10eeefc3b51f8c2",
            "path": "wasi",
            "submodules": "recursive",
            "fetch-depth": 32
          }
        },
        {
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "10.30.3"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1",
            "cache": "pnpm",
            "cache-dependency-path": "wasi/pnpm-lock.yaml"
          }
        },
        {
          "name": "Build both wrappers over one repaired engine",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\npnpm install --frozen-lockfile\nmake setup\ngit -C quickjs-ng apply --check \"$RUNNER_TEMP/parent.patch\"\ngit -C quickjs-ng apply \"$RUNNER_TEMP/parent.patch\"\ngit -C quickjs-ng apply --check \"$RUNNER_TEMP/reserved.patch\"\ngit -C quickjs-ng apply \"$RUNNER_TEMP/reserved.patch\"\npnpm run build\ncp quickjs.wasm \"$RUNNER_TEMP/patched.wasm\"\ncp -R dist \"$RUNNER_TEMP/candidate-dist\"\ngit show feb11a3da64e22f5774fc2cb6d6c6372b364e9ba:src/index.ts > src/index.ts\npnpm run build:ts\ncp -R dist \"$RUNNER_TEMP/baseline-dist\"\ngit restore --source=HEAD src/index.ts\nsha256sum \"$RUNNER_TEMP/patched.wasm\" \"$RUNNER_TEMP/\"*-dist/index.js\n"
        },
        {
          "name": "Real allocator failure through public Deferred API",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/deferred-proof.mjs\" <<'JS'\nimport assert from 'node:assert/strict';import{readFileSync}from'node:fs';import{pathToFileURL}from'node:url';\nconst tmp=process.env.RUNNER_TEMP,wasm=await WebAssembly.compile(readFileSync(tmp+'/patched.wasm')),rows=[];\nfor(const arm of ['baseline','candidate']){\n const {QuickJS,JSException}=await import(pathToFileURL(tmp+'/'+arm+'-dist/index.js'));\n using vm=await QuickJS.create({wasm,memoryLimit:16*1024*1024});void vm.undefined;void vm.true;\n using thenable=vm.evalCode('globalThis.calls=0;({then(r){++calls;r(true)}})');\n const items=Array.from({length:2048},()=>vm.newPromise());let at=-1,caught,pendingType=4;\n vm._getExports().qjs_set_memory_limit(131073);\n for(let i=0;i<items.length;i++){\n  try{items[i].resolve(thenable)}catch(error){caught=error}\n  using pending=vm.getException();pendingType=vm._getExports().qjs_typeof(pending.ptr);\n  if(caught||pendingType!==4){at=i;break}\n }\n vm._getExports().qjs_set_memory_limit(16*1024*1024);\n assert(at>=0);assert.equal(Boolean(caught),arm==='candidate');\n if(caught)assert(caught instanceof JSException);\n const reasonType=caught?vm._getExports().qjs_typeof(caught.handle.ptr):null;\n const message=caught?.message;caught?.dispose();\n const ownedAfter=vm._ownedHandles.size;assert.equal(ownedAfter,2*(items.length-at-1));\n const state=items[at].handle.promiseState;assert.equal(state,0);\n items[at].resolve(vm.true);items[at].reject(vm.undefined);\n const jobs=vm.executePendingJobs();using count=vm.evalCode('calls');const bodyCalls=count.toNumber();\n assert.equal(jobs,at);assert.equal(bodyCalls,at);\n const fresh=vm.newPromise();fresh.resolve(vm.true);assert.equal(fresh.handle.promiseState,1);fresh.handle.dispose();\n assert(thenable.isObject);\n for(const item of items)item.handle.dispose();vm.runGC();\n rows.push({arm,prepared:items.length,cap:131073,failedIndex:at,hostThrown:Boolean(caught),reasonType,message,pendingType,state,ownedAfter,jobs,bodyCalls,recovery:true});\n}\nassert.equal(rows[0].failedIndex,rows[1].failedIndex);assert.equal(rows[1].reasonType,-1);\nconsole.log('DEFERRED_REAL_ALLOCATOR',JSON.stringify(rows));\nJS\nnode \"$RUNNER_TEMP/deferred-proof.mjs\"\n"
        },
        {
          "name": "Matched warm successful-path wrapper cost",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/wasi-cost.mjs\" <<'JS'\nimport assert from 'node:assert/strict';import {readFileSync} from 'node:fs';import {pathToFileURL} from 'node:url';import {resolve} from 'node:path';import {createHash} from 'node:crypto';import {cpus,loadavg,freemem} from 'node:os';\nconst [dir,wasmPath,arm,pair]=process.argv.slice(2),{QuickJS}=await import(pathToFileURL(resolve(dir+'/index.js')));\nconst wasm=await WebAssembly.compile(readFileSync(wasmPath)),N=1000,rows=[],hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex'),start={load:loadavg(),freeMemoryBytes:freemem()};\nfor(const kind of ['resolve-primitive','reject-primitive','resolve-thenable','reaction-control']){\n using vm=await QuickJS.create({wasm,memoryLimit:32*1024*1024});void vm.undefined;void vm.true;\n using t=vm.evalCode('globalThis.calls=0;({then(r){++calls;r(true)}})');\n const expression=kind==='guest-adoption'?'Promise.resolve(t)':kind==='async-return'?'(async t=>t)(t)':kind==='async-resume'?'(async t=>{await 0;return t})(t)':'Promise.resolve(true).then(()=>{++calls})';\n using fn=vm.evalCode('t=>{globalThis.calls=0;for(let i=0;i<'+N+';i++){'+expression+'}}');\n using check=vm.evalCode('()=>calls');const samples=[];\n for(let round=-200;round<80;round++){\n  const handles=[];const cpu=process.cpuUsage(),at=performance.now();\n  if(kind!=='reaction-control'){using reset=vm.evalCode('calls=0');for(let i=0;i<N;i++){const d=vm.newPromise();if(kind==='reject-primitive')d.reject(vm.true);else d.resolve(kind==='resolve-thenable'?t:vm.true);handles.push(d.handle)}}\n  else vm.callFunction(fn,vm.undefined,t).dispose();\n  const jobs=vm.executePendingJobs();for(const h of handles){assert.equal(h.promiseState,kind==='reject-primitive'?2:1);h.dispose()}\n  const wallMs=performance.now()-at,c=process.cpuUsage(cpu),cpuMs=(c.user+c.system)/1000;\n  const adopted=kind==='resolve-thenable'||kind==='reaction-control';assert.equal(jobs,adopted?N:0);using count=vm.callFunction(check,vm.undefined);assert.equal(count.toNumber(),adopted?N:0);\n  using error=vm.getException();assert.equal(vm._getExports().qjs_typeof(error.ptr),4);\n  if(round>=0)samples.push({wallMs,cpuMs});\n }\n rows.push({kind,samples,memory:vm.getMemoryUsage(),wasmBytes:vm._getExports().memory.buffer.byteLength});\n}\nconsole.log(JSON.stringify({arm,pair:Number(pair),rows,n:N,warm:200,timed:80,probeSha256:hash(process.argv[1]),wasmSha256:hash(wasmPath),moduleSha256:hash(dir+'/index.js'),node:process.version,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},resourceUsage:process.resourceUsage()}));\n\nJS\ncat > \"$RUNNER_TEMP/cost-runner.mjs\" <<'JS'\nimport assert from 'node:assert/strict';\nimport {execFileSync} from 'node:child_process';\nimport {readFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport {cpus,loadavg,freemem} from 'node:os';\nconst mode=process.argv[2],tmp=process.env.RUNNER_TEMP,results=[];\nconst hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');\nfor(let pair=0;pair<5;pair++)for(const arm of pair%2?['candidate','baseline']:['baseline','candidate']){\n  const start={load:loadavg(),freeMemoryBytes:freemem()};\n  let r;\n  if(mode==='native'){\n    const exe=tmp+'/'+arm+'-cost';\n    r=JSON.parse(execFileSync(exe,[],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n    Object.assign(r,{arm,pair,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},executableSha256:hash(exe),probeSha256:hash(tmp+'/native-cost.c')});\n  }else r=JSON.parse(execFileSync(process.execPath,[tmp+'/wasi-cost.mjs',tmp+'/'+arm+'-dist',tmp+'/patched.wasm',arm,String(pair)],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n  results.push(r);console.log('DEFERRED_'+mode.toUpperCase()+'_RAW',JSON.stringify(r));\n}\nfor(const r of results){\n  assert.equal(r.probeSha256,results[0].probeSha256);\n  for(const row of r.rows){assert.equal(row.samples.length,80);for(const s of row.samples)assert(Number.isFinite(s.wallMs)&&s.wallMs>0&&Number.isFinite(s.cpuMs)&&s.cpuMs>0);}\n}\nconst median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)],p95=a=>[...a].sort((a,b)=>a-b)[Math.ceil(a.length*.95)-1];\nconsole.log('DEFERRED_'+mode.toUpperCase()+'_SUMMARY',JSON.stringify(results[0].rows.map(row=>({kind:row.kind,pairs:Array.from({length:5},(_,pair)=>{\n  const arms=Object.fromEntries(results.filter(r=>r.pair===pair).map(r=>[r.arm,r.rows.find(x=>x.kind===row.kind).samples]));\n  const metrics=Object.fromEntries(Object.entries(arms).map(([arm,a])=>[arm,{wallMedianMs:median(a.map(s=>s.wallMs)),cpuMedianMs:median(a.map(s=>s.cpuMs)),wallP95Ms:p95(a.map(s=>s.wallMs)),earlyMedianMs:median(a.slice(0,20).map(s=>s.wallMs)),lateMedianMs:median(a.slice(-20).map(s=>s.wallMs))}]));\n  return{pair,arms:metrics,wallRatio:metrics.candidate.wallMedianMs/metrics.baseline.wallMedianMs,cpuRatio:metrics.candidate.cpuMedianMs/metrics.baseline.cpuMedianMs};\n})}))));\n\nJS\nnode \"$RUNNER_TEMP/cost-runner.mjs\" wasi\n"
        }
      ]
    }
  }
}
