{
  "name": "Identify native generator allocator phases",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "2c02c2c1f64ab11132fbfabff3cdf4c7fcd2f5eb",
            "fetch-depth": 16
          }
        },
        {
          "name": "Release and parent failure controls",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 <<'CONTROL'\nfrom pathlib import Path\np=Path('api-test.c');s=p.read_text();s=s[:s.index('int main(void)')]+'int main(void) { for (int mode=0;mode<9;mode++) for(int room=-1;room<=0;room++){ fprintf(stderr,\"PHASE mode=%d room=%d\\\\n\",mode,room); int failed=generator_delivery_trial(mode,room); fprintf(stderr,\"RESULT mode=%d room=%d failed=%d\\\\n\",mode,room,failed); } generator_delivery_controls(); return 0; }\\n';p.write_text(s)\nCONTROL\ncmake -S . -B \"$RUNNER_TEMP/candidate\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/candidate\" --target api-test -j2\n\"$RUNNER_TEMP/candidate/api-test\"\n"
        }
      ]
    }
  }
}
