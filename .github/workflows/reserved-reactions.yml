{
  "name": "Reserved Promise reaction qualification",
  "on": {
    "push": {
      "branches": [
        "ci/reserved-promise-reactions"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native-diagnostic": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "37f02b6d6b804c21fb8833bebd9ef1697fc44129",
            "fetch-depth": 8
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1"
          }
        },
        {
          "name": "Isolate failing settlement fixture",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 <<'CONTROL'\nfrom pathlib import Path\np=Path('api-test.c');s=p.read_text()\ns=s.replace('    assert(argc == 1 && JS_IsSameValue(ctx, argv[0], JS_TRUE));','    if(argc != 1 || !JS_IsSameValue(ctx, argv[0], JS_TRUE)) fprintf(stderr,\"bad handler magic=%d argc=%d tag=%d bool=%d\\\\n\",magic,argc,argc?JS_VALUE_GET_TAG(argv[0]):999,argc?JS_ToBool(ctx,argv[0]):-1);\\n    assert(argc == 1 && JS_IsSameValue(ctx, argv[0], JS_TRUE));')\ns=s[:s.index('int main(void)')]+'int main(int argc,char **argv) { assert(argc==4); if(atoi(argv[1])==0) promise_settlement_trial(atoi(argv[2]),atoi(argv[3]),-1); else if(atoi(argv[1])==1) promise_settlement_async(atoi(argv[2])); else promise_settlement_lifecycle(atoi(argv[2])); return 0; }\\n'\np.write_text(s)\nCONTROL\nfor arm in candidate baseline; do\n if [ \"$arm\" = baseline ]; then git show d3c90857ccba4c47b39d023280726efa276e3098:quickjs.c > quickjs.c; fi\n cmake -S . -B \"$RUNNER_TEMP/$arm-build\" -DCMAKE_BUILD_TYPE=Release\n cmake --build \"$RUNNER_TEMP/$arm-build\" --target api-test -j2\ndone\nulimit -c 0\npython3 <<'CONTROL'\nimport subprocess,os,json\nfor arm in ['candidate','baseline']:\n for case in [(0,r,l) for r in range(2) for l in range(2)]+[(1,r,0) for r in range(2)]+[(2,m,0) for m in range(3)]:\n  p=subprocess.run([os.environ['RUNNER_TEMP']+'/'+arm+'-build/api-test',*map(str,case)],capture_output=True,text=True,timeout=120)\n  print('RESERVED_DIAG',json.dumps({'arm':arm,'case':case,'code':p.returncode,'stderr':p.stderr[-1800:]}),flush=True)\nCONTROL\n"
        }
      ]
    }
  }
}
