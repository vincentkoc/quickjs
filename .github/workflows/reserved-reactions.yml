{
  "name": "Final generator recovery marker API qualification",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "api": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "config": "Release",
              "flags": ""
            },
            {
              "config": "RelWithDebInfo",
              "flags": "-DQJS_ENABLE_ASAN=ON -DQJS_ENABLE_UBSAN=ON"
            }
          ]
        }
      },
      "env": {
        "ASAN_OPTIONS": "halt_on_error=1",
        "UBSAN_OPTIONS": "halt_on_error=1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "d1cef1501a841cda4330d9b4abeb593dd019a686",
            "fetch-depth": 16
          }
        },
        {
          "name": "Final-head API and allocator recovery",
          "shell": "bash",
          "run": "set -euo pipefail\nsha256sum quickjs.c api-test.c\ncmake -S . -B \"$RUNNER_TEMP/build\" -DCMAKE_BUILD_TYPE=${{ matrix.config }} ${{ matrix.flags }}\ncmake --build \"$RUNNER_TEMP/build\" --target api-test -j2\n\"$RUNNER_TEMP/build/api-test\"\ngit diff --exit-code\necho GENERATOR_FINAL_API_PASS\n"
        }
      ]
    }
  }
}
