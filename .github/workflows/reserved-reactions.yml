{
  "name": "Async generator final delegated coverage",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "f29e6b2e7fa3eb914eb773539f6798afcf622fdf",
            "fetch-depth": 40
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1"
          }
        },
        {
          "name": "Release suites, Node control and isolated parent cases",
          "shell": "bash",
          "run": "set -euo pipefail\nsha256sum quickjs.c tests/async-generator-resolver-reentry.js\ncmake -S . -B \"$RUNNER_TEMP/candidate\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/candidate\" -j2\n\"$RUNNER_TEMP/candidate/api-test\"\n\"$RUNNER_TEMP/candidate/run-test262\" -c tests.conf\nnode tests/async-generator-resolver-reentry.js\necho REENTRY_CANDIDATE_NODE_SUITES_PASS\ngit show d1cef1501a841cda4330d9b4abeb593dd019a686:quickjs.c > quickjs.c\ncmake -S . -B \"$RUNNER_TEMP/baseline\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/baseline\" --target qjs_exe -j2\nulimit -c 0\npython3 <<'PY'\nfrom pathlib import Path\nimport subprocess,os,json\nsource=Path('tests/async-generator-resolver-reentry.js').read_text()\nrows=[]\nfor mode in range(8):\n s=source.replace('[false, true]',str([mode>=3]).lower(),1) if mode<6 else source.replace('[false, true]','[]',1)\n s=s.replace('[\"next\", \"return\", \"throw\"]',json.dumps([[\"next\",\"return\",\"throw\"][mode%3]]),1) if mode<6 else s\n s=s.replace('for (const rejected of [false, true])', 'for (const rejected of '+(str([mode==7]).lower() if mode>=6 else '[]')+')')\n s=s.replace('assert(await testReentry(), 8);','assert(await testReentry(), 1);')\n path=Path('tests/reentry-selected.mjs');path.write_text(s)\n p=subprocess.run([os.environ['RUNNER_TEMP']+'/baseline/qjs','-m',str(path)],capture_output=True,text=True,timeout=30)\n rows.append({'mode':mode,'exit':p.returncode,'assertion':next((line for line in p.stderr.splitlines() if 'assertion failed' in line),'')})\npath.unlink()\nprint('REENTRY_PARENT_CONTROLS',json.dumps(rows))\nassert rows[0]['exit']!=0 and rows[3]['exit']!=0,rows\nPY\necho REENTRY_NATIVE_DONE\n"
        }
      ]
    },
    "sanitizers": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "f29e6b2e7fa3eb914eb773539f6798afcf622fdf",
            "fetch-depth": 40
          }
        },
        {
          "name": "ASan UBSan suites",
          "shell": "bash",
          "run": "set -euo pipefail\ncmake -S . -B \"$RUNNER_TEMP/build\" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQJS_ENABLE_ASAN=ON -DQJS_ENABLE_UBSAN=ON\ncmake --build \"$RUNNER_TEMP/build\" -j2\n\"$RUNNER_TEMP/build/api-test\"\n\"$RUNNER_TEMP/build/run-test262\" -c tests.conf\necho REENTRY_SANITIZED_PASS\n"
        }
      ]
    },
    "wasi": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "f29e6b2e7fa3eb914eb773539f6798afcf622fdf",
            "fetch-depth": 40,
            "path": "ng-source"
          }
        },
        {
          "name": "Extract production layers",
          "shell": "bash",
          "run": "set -euo pipefail\ngit -C ng-source diff d7215b0ad3fc2c562e8317fd9bca058fd4863804 d1cef1501a841cda4330d9b4abeb593dd019a686 -- quickjs.c > \"$RUNNER_TEMP/parent.patch\"\ngit -C ng-source diff d1cef1501a841cda4330d9b4abeb593dd019a686 f29e6b2e7fa3eb914eb773539f6798afcf622fdf -- quickjs.c > \"$RUNNER_TEMP/reentry.patch\"\nsha256sum \"$RUNNER_TEMP/parent.patch\" \"$RUNNER_TEMP/reentry.patch\"\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "vincentkoc/quickjs-wasi",
            "ref": "6a9bb60e52314f843c7f52f1723b713024681338",
            "path": "wasi",
            "submodules": "recursive",
            "fetch-depth": 32
          }
        },
        {
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "10.30.3"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1",
            "cache": "pnpm",
            "cache-dependency-path": "wasi/pnpm-lock.yaml"
          }
        },
        {
          "name": "Build same production binaries for final delegated coverage",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\ntest \"$(git -C quickjs-ng rev-parse HEAD)\" = 6d46d07d04041b40f4f49eaa7fdebe44c314c699\npnpm install --frozen-lockfile\nmake setup\ngit -C quickjs-ng apply --check \"$RUNNER_TEMP/parent.patch\"\ngit -C quickjs-ng apply \"$RUNNER_TEMP/parent.patch\"\nfor arm in baseline candidate; do\n if [ \"$arm\" = candidate ]; then\n  git -C quickjs-ng apply --check \"$RUNNER_TEMP/reentry.patch\"\n  git -C quickjs-ng apply \"$RUNNER_TEMP/reentry.patch\"\n fi\n pnpm run build\n cp quickjs.wasm \"$RUNNER_TEMP/$arm.wasm\"\n sha256sum quickjs.wasm dist/index.js\ndone\ncp -R dist \"$RUNNER_TEMP/wasi-dist\"\n"
        },
        {
          "name": "Real WASI reentry witness",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/reentry-proof.mjs\" <<'JS'\nimport assert from'node:assert/strict';import{readFileSync}from'node:fs';import{pathToFileURL}from'node:url';import{createHash}from'node:crypto';\nconst tmp=process.env.RUNNER_TEMP,{QuickJS}=await import(pathToFileURL(tmp+'/wasi-dist/index.js')),hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex'),helpers=readFileSync('ng-source/tests/assert.js','utf8').replace(/^export /gm,''),source=readFileSync('ng-source/tests/async-generator-resolver-reentry.js','utf8').replace(/^import .*;\\n/,'').replace('assert(await testReentry(), 8);','testReentry();');\nfor(const arm of['baseline','candidate']){using vm=await QuickJS.create({wasm:await WebAssembly.compile(readFileSync(tmp+'/'+arm+'.wasm')),memoryLimit:16*1024*1024});using p=vm.evalCode(helpers+'\\n'+source);const jobs=vm.executePendingJobs();const result=await vm.resolvePromise(p),state=p.promiseState;let value,error;if('value'in result){using h=result.value;value=h.toNumber();}else{using h=result.error;error=h.toString();}console.log('REENTRY_WASI_CONTROL',JSON.stringify({arm,jobs,state,value,error,wasmSha256:hash(tmp+'/'+arm+'.wasm'),moduleSha256:hash(tmp+'/wasi-dist/index.js')}));if(arm==='candidate'){assert.equal(state,1);assert.equal(value,8);}else{assert.equal(state,2);assert.match(error,/assertion failed/);}}\nconsole.log('REENTRY_WASI_PROBE_SHA256',hash(process.argv[1]));\nJS\nnode \"$RUNNER_TEMP/reentry-proof.mjs\"\n"
        }
      ]
    }
  }
}
