{
  "name": "Reserved Promise reaction qualification",
  "on": {
    "push": {
      "branches": [
        "ci/reserved-promise-reactions"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "678c0404f70613129059bd17d1c847ab9b5c2590",
            "fetch-depth": 8
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1"
          }
        },
        {
          "name": "Matched frozen native production pair",
          "shell": "bash",
          "run": "set -euo pipefail\ncmake -S . -B \"$RUNNER_TEMP/candidate-build\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/candidate-build\" -j2\n\"$RUNNER_TEMP/candidate-build/api-test\"\n\"$RUNNER_TEMP/candidate-build/run-test262\" -c tests.conf\necho RESERVED_RELEASE_PASS\ngit show d3c90857ccba4c47b39d023280726efa276e3098:quickjs.c > quickjs.c\npython3 <<'CONTROL'\nfrom pathlib import Path\np=Path('api-test.c');s=p.read_text();s=s[:s.index('int main(void)')]+'int main(int argc,char **argv) { assert(argc==4); if(atoi(argv[1])==0) promise_settlement_trial(atoi(argv[2]),atoi(argv[3]),-1); else if(atoi(argv[1])==1) promise_settlement_async(atoi(argv[2])); else promise_settlement_lifecycle(atoi(argv[2])); return 0; }\\n'\np.write_text(s)\nCONTROL\ncmake -S . -B \"$RUNNER_TEMP/baseline-build\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/baseline-build\" --target api-test -j2\ngit restore --source=HEAD quickjs.c api-test.c\ngit diff --exit-code\nulimit -c 0\npython3 <<'CONTROL'\nimport subprocess,os,json,signal\nrows=[]\ncases=[(0,r,l) for r in range(2) for l in range(2)]+[(1,r,0) for r in range(2)]+[(2,m,0) for m in range(3)]\nfor mode,r,l in cases:\n p=subprocess.run([os.environ['RUNNER_TEMP']+'/baseline-build/api-test',str(mode),str(r),str(l)],capture_output=True,text=True,timeout=120)\n rows.append({'mode':mode,'case':r,'limited':l,'code':p.returncode,'stderr':p.stderr[-1800:]})\nprint('RESERVED_RED',json.dumps(rows),flush=True)\nfor row in rows:\n bad=(row['mode']==1 and row['case']==0) or (row['mode']==0 and row['limited']==1)\n assert row['code']==(-signal.SIGABRT if bad else 0),row\n if bad:assert '!JS_HasException' in row['stderr'],row\nCONTROL\n"
        },
        {
          "name": "Subscription and generic enqueue cost",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/native-cost.c\" <<'C'\n#ifdef NDEBUG\n#undef NDEBUG\n#endif\n#include <assert.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n#include \"quickjs.h\"\n#define N 10000\nstatic JSValue values[N];\nstatic JSValue handler(JSContext *c, JSValueConst t, int n, JSValueConst *a) {\n    assert(n==1 && JS_IsSameValue(c,a[0],JS_TRUE));\n    ++*(int *)JS_GetContextOpaque(c);\n    return JS_TRUE;\n}\nstatic JSValue job(JSContext *c,int n,JSValueConst *a) {\n    assert(n==1 && JS_IsSameValue(c,a[0],JS_TRUE));\n    ++*(int *)JS_GetContextOpaque(c);\n    return JS_UNDEFINED;\n}\nstatic double clock_ms(clockid_t id) {\n    struct timespec t;assert(clock_gettime(id,&t)==0);\n    return t.tv_sec*1000.0+t.tv_nsec/1e6;\n}\nint main(void) {\n    const char *kinds[]={\"native-pending\",\"native-fulfilled\",\"native-rejected\",\"guest-fulfilled\",\"guest-rejected\",\"enqueue-job\"};\n    printf(\"{\\\"rows\\\":[\");\n    for(int kind=0;kind<6;kind++){\n        JSRuntime *rt=JS_NewRuntime();assert(rt);JS_SetDumpFlags(rt,JS_ABORT_ON_LEAKS);\n        JSContext *c=JS_NewContext(rt);assert(c);int calls=0;JS_SetContextOpaque(c,&calls);\n        JSValue fn=JS_NewCFunction(c,handler,\"handler\",1),source=JS_UNDEFINED,rs[2]={JS_UNDEFINED,JS_UNDEFINED},method=JS_UNDEFINED,arg=JS_TRUE;\n        if(kind>0&&kind<5){\n            source=JS_NewPromiseCapability(c,rs);assert(!JS_IsException(source));\n            JSValue v=JS_Call(c,rs[kind==2||kind==4],JS_UNDEFINED,1,&arg);assert(!JS_IsException(v));JS_FreeValue(c,v);\n            method=JS_GetPropertyStr(c,source,\"then\");assert(!JS_IsException(method));\n        }\n        printf(\"%s{\\\"kind\\\":\\\"%s\\\",\\\"samples\\\":[\",kind?\",\":\"\",kinds[kind]);\n        for(int round=-20;round<40;round++){\n            if(kind==0){source=JS_NewPromiseCapability(c,rs);assert(!JS_IsException(source));}\n            calls=0;\n            double cpu=clock_ms(CLOCK_PROCESS_CPUTIME_ID),at=clock_ms(CLOCK_MONOTONIC);\n            for(int i=0;i<N;i++){\n                if(kind==5)assert(JS_EnqueueJob(c,job,1,&arg)==0);\n                else if(kind>=3){JSValueConst args[]={fn,fn};values[i]=JS_Call(c,method,source,2,args);}\n                else values[i]=JS_PromiseThen(c,source,fn,fn);\n            }\n            double wall=clock_ms(CLOCK_MONOTONIC)-at;cpu=clock_ms(CLOCK_PROCESS_CPUTIME_ID)-cpu;\n            assert(!JS_HasException(c)&&calls==0);\n            for(int i=0;i<N&&kind<5;i++)assert(JS_PromiseState(c,values[i])==JS_PROMISE_PENDING);\n            if(kind==0){JSValue v=JS_Call(c,rs[0],JS_UNDEFINED,1,&arg);assert(!JS_IsException(v));JS_FreeValue(c,v);}\n            int jobs=0;JSContext *jc;\n            while(JS_IsJobPending(rt)){assert(JS_ExecutePendingJob(rt,&jc)>0);jobs++;}\n            assert(jobs==N&&calls==N&&!JS_HasException(c));\n            for(int i=0;i<N&&kind<5;i++){\n                assert(JS_PromiseState(c,values[i])==JS_PROMISE_FULFILLED);\n                JSValue v=JS_PromiseResult(c,values[i]);assert(JS_IsSameValue(c,v,JS_TRUE));JS_FreeValue(c,v);JS_FreeValue(c,values[i]);\n            }\n            if(kind==0){JS_FreeValue(c,source);for(int i=0;i<2;i++)JS_FreeValue(c,rs[i]);}\n            JS_RunGC(rt);assert(!JS_HasException(c));\n            if(round>=0)printf(\"%s{\\\"wallMs\\\":%.9f,\\\"cpuMs\\\":%.9f}\",round?\",\":\"\",wall,cpu);\n        }\n        printf(\"]}\");\n        if(kind>0&&kind<5){JS_FreeValue(c,source);for(int i=0;i<2;i++)JS_FreeValue(c,rs[i]);}\n        JS_FreeValue(c,method);JS_FreeValue(c,fn);JS_FreeContext(c);JS_RunGC(rt);\n        JSMemoryUsage usage;JS_ComputeMemoryUsage(rt,&usage);assert(usage.obj_count==0);JS_FreeRuntime(rt);\n    }\n    printf(\"],\\\"warmups\\\":20,\\\"rounds\\\":40,\\\"operationsPerBatch\\\":%d}\\n\",N);\n}\nC\ncat > \"$RUNNER_TEMP/cost-runner.mjs\" <<'JS'\nimport assert from 'node:assert/strict';\nimport {execFileSync} from 'node:child_process';\nimport {readFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport {cpus,loadavg,freemem} from 'node:os';\nconst mode=process.argv[2],tmp=process.env.RUNNER_TEMP,results=[];\nconst hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');\nfor(let pair=0;pair<5;pair++)for(const arm of pair%2?['candidate','baseline']:['baseline','candidate']){\n  const start={load:loadavg(),freeMemoryBytes:freemem()};\n  let r;\n  if(mode==='native'){\n    const exe=tmp+'/'+arm+'-cost';\n    r=JSON.parse(execFileSync(exe,[],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n    Object.assign(r,{arm,pair,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},executableSha256:hash(exe),probeSha256:hash(tmp+'/native-cost.c')});\n  }else r=JSON.parse(execFileSync(process.execPath,[tmp+'/wasi-cost.mjs','wasi/dist',tmp+'/'+arm+'.wasm',arm,String(pair)],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n  results.push(r);console.log('META_'+mode.toUpperCase()+'_RAW',JSON.stringify(r));\n}\nfor(const r of results){\n  assert.equal(r.probeSha256,results[0].probeSha256);\n  for(const row of r.rows){assert.equal(row.samples.length,40);for(const s of row.samples)assert(Number.isFinite(s.wallMs)&&s.wallMs>0&&Number.isFinite(s.cpuMs)&&s.cpuMs>0);}\n}\nconst median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)],p95=a=>[...a].sort((a,b)=>a-b)[Math.ceil(a.length*.95)-1];\nconsole.log('META_'+mode.toUpperCase()+'_SUMMARY',JSON.stringify(results[0].rows.map(row=>({kind:row.kind,pairs:Array.from({length:5},(_,pair)=>{\n  const arms=Object.fromEntries(results.filter(r=>r.pair===pair).map(r=>[r.arm,r.rows.find(x=>x.kind===row.kind).samples]));\n  const metrics=Object.fromEntries(Object.entries(arms).map(([arm,a])=>[arm,{wallMedianMs:median(a.map(s=>s.wallMs)),cpuMedianMs:median(a.map(s=>s.cpuMs)),wallP95Ms:p95(a.map(s=>s.wallMs)),earlyMedianMs:median(a.slice(0,10).map(s=>s.wallMs)),lateMedianMs:median(a.slice(-10).map(s=>s.wallMs))}]));\n  return{pair,arms:metrics,wallRatio:metrics.candidate.wallMedianMs/metrics.baseline.wallMedianMs,cpuRatio:metrics.candidate.cpuMedianMs/metrics.baseline.cpuMedianMs};\n})}))));\n\nJS\nfor arm in baseline candidate; do\n  cc -O3 -D_GNU_SOURCE -I. \"$RUNNER_TEMP/native-cost.c\" \"$RUNNER_TEMP/$arm-build/libqjs.a\" -lm -ldl -pthread -o \"$RUNNER_TEMP/$arm-cost\"\ndone\nnode \"$RUNNER_TEMP/cost-runner.mjs\" native"
        }
      ]
    },
    "sanitizers": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "env": {
        "ASAN_OPTIONS": "halt_on_error=1",
        "UBSAN_OPTIONS": "halt_on_error=1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "678c0404f70613129059bd17d1c847ab9b5c2590"
          }
        },
        {
          "name": "Full sanitized API and tests",
          "shell": "bash",
          "run": "set -euo pipefail\ncmake -S . -B \"$RUNNER_TEMP/build\" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQJS_ENABLE_ASAN=ON -DQJS_ENABLE_UBSAN=ON\ncmake --build \"$RUNNER_TEMP/build\" -j2\n\"$RUNNER_TEMP/build/api-test\"\n\"$RUNNER_TEMP/build/run-test262\" -c tests.conf\ngit diff --exit-code\necho RESERVED_SANITIZED_PASS\n"
        }
      ]
    }
  }
}
