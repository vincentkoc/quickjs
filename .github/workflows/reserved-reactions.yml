{
  "name": "Generator allocator proof using measured CI artifacts",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "allocator": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1"
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "generator-delivery-wasi",
            "run-id": 41618356147,
            "github-token": "${{ github.token }}",
            "path": "${{ runner.temp }}/generator-proof"
          }
        },
        {
          "name": "Bounded allocation alignment with prepared spare capabilities",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/generator-proof.mjs\" <<'JS'\nimport assert from'node:assert/strict';import{readFileSync}from'node:fs';import{pathToFileURL}from'node:url';import{createHash}from'node:crypto';\nconst tmp=process.env.RUNNER_TEMP+'/generator-proof',{QuickJS}=await import(pathToFileURL(tmp+'/wasi-dist/index.js')),rows=[],N=512,K=4;\nfor(const arm of ['baseline','candidate']){const bytes=readFileSync(tmp+'/'+arm+'.wasm'),wasm=await WebAssembly.compile(bytes);\nfor(let prime=0;prime<=K;prime++){using vm=await QuickJS.create({wasm,memoryLimit:16*1024*1024});void vm.undefined;\n vm.evalCode('globalThis.phase=0;globalThis.getters=0;globalThis.bodies=0;globalThis.extraIndex=0;globalThis.extraResolves=[];globalThis.release=undefined;const gate=new Promise(r=>release=r);globalThis.gens=[];globalThis.requests=[];for(let i=0;i<'+N+';i++){const g=(async function*(){yield gate})();gens.push(g);requests.push(g.next())}for(let i=0;i<'+(N*K+prime)+';i++)new Promise(r=>extraResolves.push(r));const then=r=>{bodies++;r(true)};globalThis.t={then};Object.defineProperty(Object.prototype,\"then\",{configurable:true,get(){getters++;phase=1;for(let j=0;j<'+K+';j++)extraResolves[extraIndex++](t);phase=2;return then}})').dispose();\n using release=vm.evalCode('release'),readPhase=vm.evalCode('()=>phase'),priming=vm.evalCode('()=>{for(let j=0;j<'+prime+';j++)extraResolves[extraIndex++](t)}');const e=vm._getExports();vm.callFunctionRaw(release,vm.undefined).dispose();vm.callFunctionRaw(priming,vm.undefined).dispose();e.qjs_set_memory_limit(131073);\n let observation,jobs=0;\n while(jobs<N){const status=e.qjs_execute_pending_job();jobs++;const ptr=e.qjs_get_exception(),tag=e.qjs_typeof(ptr);e.qjs_free_value(ptr);using ph=vm.callFunctionRaw(readPhase,vm.undefined);const phase=ph.toNumber();if(tag!==4||phase===1||status<=0){observation={status,tag,phase};break;}}\n e.qjs_set_memory_limit(16*1024*1024);using h=vm.evalCode('JSON.stringify({getters,bodies,extraIndex})');const counts=JSON.parse(h.toString());using request=vm.evalCode('requests['+(jobs-1)+']');const state=request.promiseState;const row={arm,prime,jobs,observation:observation??null,...counts,promiseState:state,wasmSha256:createHash('sha256').update(bytes).digest('hex')};rows.push(row);console.log('GENERATOR_ALLOCATOR_SEARCH',JSON.stringify(row));assert.equal(counts.bodies,0);\n}}\nconst match=Array.from({length:K+1},(_,prime)=>rows.filter(r=>r.prime===prime)).find(a=>a.length===2&&a.every(r=>r.observation&&r.observation.tag!==4&&r.observation.phase===2&&r.getters===r.jobs)&&a.find(r=>r.arm==='baseline').observation.status===1&&a.find(r=>r.arm==='candidate').observation.status===-1);\nassert(match,'no own-adoption failure in the bounded alignment cases');const candidate=match.find(r=>r.arm==='candidate');assert.equal(candidate.promiseState,0);assert.equal(match[0].jobs,match[1].jobs);console.log('GENERATOR_WASI_ALLOCATOR',JSON.stringify(match));console.log('GENERATOR_WASI_PROBE_SHA256',createHash('sha256').update(readFileSync(process.argv[1])).digest('hex'));\nJS\nnode \"$RUNNER_TEMP/generator-proof.mjs\"\n"
        }
      ]
    }
  }
}
