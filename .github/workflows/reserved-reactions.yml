{
  "name": "Thenable enqueue qualification",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 8
          }
        },
        {
          "run": "set -euo pipefail\ncmake -S . -B \"$RUNNER_TEMP/candidate\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/candidate\" -j2\n\"$RUNNER_TEMP/candidate/api-test\"\n\"$RUNNER_TEMP/candidate/run-test262\" -c tests.conf\necho ADOPTION_RELEASE_PASS\npython3 <<'CONTROL'\nfrom pathlib import Path\np=Path('api-test.c');s=p.read_text();s=s[:s.index('int main(void)')]+'int main(int argc,char **argv) { assert(argc==3); promise_adoption_trial(atoi(argv[1]),atoi(argv[2]),-1,0); return 0; }\\n';p.write_text(s)\nCONTROL\ngit show 678c0404f70613129059bd17d1c847ab9b5c2590:quickjs.c > quickjs.c\ncmake -S . -B \"$RUNNER_TEMP/baseline\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/baseline\" --target api-test -j2\ngit restore --source=HEAD quickjs.c\npython3 <<'CONTROL'\nfrom pathlib import Path\np=Path('quickjs.c');s=p.read_text();a=s.index('                /* Intrinsic resolution can fail');b=s.index('            }',a);s=s[:a]+'                if (JS_IsUncatchableError(ctx->rt->current_exception)) {\\n                    is_success = false;\\n                } else {\\n                    abort(); /* BUG */\\n                }\\n' +s[b:];p.write_text(s)\nCONTROL\ncmake -S . -B \"$RUNNER_TEMP/enqueue-only\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/enqueue-only\" --target api-test -j2\ngit restore --source=HEAD quickjs.c api-test.c\ngit diff --exit-code\nulimit -c 0\npython3 <<'CONTROL'\nimport subprocess,os,json,signal\nrows=[]\nfor arm,mode,headroom,bad in [(a,m,h,a=='baseline' and h==0 and m!=3 or a=='enqueue-only' and h==0 and m in (2,4)) for a in ['baseline','enqueue-only'] for m in range(5) for h in [0,-1]]:\n p=subprocess.run([os.environ['RUNNER_TEMP']+'/'+arm+'/api-test',str(mode),str(headroom)],capture_output=True,text=True,timeout=120)\n row={'arm':arm,'mode':mode,'headroom':headroom,'exit':p.returncode,'stderr':p.stderr[-600:]};rows.append(row)\n assert p.returncode==(-signal.SIGABRT if bad else 0),row\nprint('ADOPTION_OLD_CONTROLS',json.dumps(rows))\nCONTROL\n",
          "shell": "bash"
        },
        {
          "name": "Matched native adoption cost",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/native-cost.c\" <<'C'\n#ifdef NDEBUG\n#undef NDEBUG\n#endif\n#include <assert.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n#include <sys/resource.h>\n#include \"quickjs.h\"\n#define N 1000\nstatic JSValue values[N];\nstatic double now(clockid_t c){struct timespec t;assert(!clock_gettime(c,&t));return t.tv_sec*1000.+t.tv_nsec/1e6;}\nstatic JSValue job(JSContext*c,int n,JSValueConst*a){++*(int*)JS_GetContextOpaque(c);return JS_UNDEFINED;}\nint main(void){\n const char* kinds[]={\"native-adoption\",\"guest-adoption\",\"async-return\",\"async-resume\",\"enqueue-job\"};\n const char* codes[]={\"({then(r){r(true)}})\",\"t=>Promise.resolve(t)\",\"async t=>t\",\"async t=>{await 0;return t;}\"};\n printf(\"{\\\"rows\\\":[\");\n for(int k=0;k<5;k++){\n  JSRuntime*rt=JS_NewRuntime();assert(rt);JS_SetDumpFlags(rt,JS_ABORT_ON_LEAKS);JSContext*c=JS_NewContext(rt),*jc;assert(c);int calls=0;JS_SetContextOpaque(c,&calls);\n  JSValue t=JS_Eval(c,codes[0],strlen(codes[0]),\"probe\",0),fn=JS_UNDEFINED;assert(!JS_IsException(t));\n  if(k>0&&k<4){fn=JS_Eval(c,codes[k],strlen(codes[k]),\"probe\",0);assert(!JS_IsException(fn));}\n  printf(\"%s{\\\"kind\\\":\\\"%s\\\",\\\"samples\\\":[\",k?\",\":\"\",kinds[k]);\n  for(int round=-20;round<40;round++){\n   calls=0;double cpu=now(CLOCK_PROCESS_CPUTIME_ID),at=now(CLOCK_MONOTONIC);\n   for(int i=0;i<N;i++){\n    if(k==4){assert(!JS_EnqueueJob(c,job,0,NULL));continue;}\n    if(k==0){JSValue rs[2],v;values[i]=JS_NewPromiseCapability(c,rs);assert(!JS_IsException(values[i]));v=JS_Call(c,rs[0],JS_UNDEFINED,1,(JSValueConst*)&t);assert(!JS_IsException(v));JS_FreeValue(c,v);JS_FreeValue(c,rs[0]);JS_FreeValue(c,rs[1]);}\n    else values[i]=JS_Call(c,fn,JS_UNDEFINED,1,(JSValueConst*)&t);\n    assert(!JS_IsException(values[i]));\n   }\n   int jobs=0;while(JS_IsJobPending(rt)){assert(JS_ExecutePendingJob(rt,&jc)>0&&jc==c);jobs++;}\n   assert(jobs==N*(k==3?2:1)&&!JS_HasException(c));\n   for(int i=0;i<N&&k<4;i++){assert(JS_PromiseState(c,values[i])==JS_PROMISE_FULFILLED);JSValue v=JS_PromiseResult(c,values[i]);assert(JS_IsSameValue(c,v,JS_TRUE));JS_FreeValue(c,v);JS_FreeValue(c,values[i]);}\n   if(k==4)assert(calls==N);\n   double wall=now(CLOCK_MONOTONIC)-at;cpu=now(CLOCK_PROCESS_CPUTIME_ID)-cpu;\n   if(round>=0)printf(\"%s{\\\"wallMs\\\":%.9f,\\\"cpuMs\\\":%.9f}\",round?\",\":\"\",wall,cpu);\n  }\n  printf(\"]}\");JS_FreeValue(c,fn);JS_FreeValue(c,t);JS_FreeContext(c);JS_FreeRuntime(rt);\n }\n struct rusage u;assert(!getrusage(RUSAGE_SELF,&u));printf(\"],\\\"n\\\":%d,\\\"warm\\\":20,\\\"timed\\\":40,\\\"maxRssKiB\\\":%ld}\\n\",N,u.ru_maxrss);\n}\n\nC\ncat > \"$RUNNER_TEMP/cost-runner.mjs\" <<'JS'\nimport assert from 'node:assert/strict';\nimport {execFileSync} from 'node:child_process';\nimport {readFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport {cpus,loadavg,freemem} from 'node:os';\nconst mode=process.argv[2],tmp=process.env.RUNNER_TEMP,results=[];\nconst hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');\nfor(let pair=0;pair<5;pair++)for(const arm of pair%2?['candidate','baseline']:['baseline','candidate']){\n  const start={load:loadavg(),freeMemoryBytes:freemem()};\n  let r;\n  if(mode==='native'){\n    const exe=tmp+'/'+arm+'-cost';\n    r=JSON.parse(execFileSync(exe,[],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n    Object.assign(r,{arm,pair,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},executableSha256:hash(exe),probeSha256:hash(tmp+'/native-cost.c')});\n  }else r=JSON.parse(execFileSync(process.execPath,[tmp+'/wasi-cost.mjs','wasi/dist',tmp+'/'+arm+'.wasm',arm,String(pair)],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n  results.push(r);console.log('META_'+mode.toUpperCase()+'_RAW',JSON.stringify(r));\n}\nfor(const r of results){\n  assert.equal(r.probeSha256,results[0].probeSha256);\n  for(const row of r.rows){assert.equal(row.samples.length,40);for(const s of row.samples)assert(Number.isFinite(s.wallMs)&&s.wallMs>0&&Number.isFinite(s.cpuMs)&&s.cpuMs>0);}\n}\nconst median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)],p95=a=>[...a].sort((a,b)=>a-b)[Math.ceil(a.length*.95)-1];\nconsole.log('META_'+mode.toUpperCase()+'_SUMMARY',JSON.stringify(results[0].rows.map(row=>({kind:row.kind,pairs:Array.from({length:5},(_,pair)=>{\n  const arms=Object.fromEntries(results.filter(r=>r.pair===pair).map(r=>[r.arm,r.rows.find(x=>x.kind===row.kind).samples]));\n  const metrics=Object.fromEntries(Object.entries(arms).map(([arm,a])=>[arm,{wallMedianMs:median(a.map(s=>s.wallMs)),cpuMedianMs:median(a.map(s=>s.cpuMs)),wallP95Ms:p95(a.map(s=>s.wallMs)),earlyMedianMs:median(a.slice(0,10).map(s=>s.wallMs)),lateMedianMs:median(a.slice(-10).map(s=>s.wallMs))}]));\n  return{pair,arms:metrics,wallRatio:metrics.candidate.wallMedianMs/metrics.baseline.wallMedianMs,cpuRatio:metrics.candidate.cpuMedianMs/metrics.baseline.cpuMedianMs};\n})}))));\n\nJS\nfor arm in baseline candidate; do\n cc -O3 -D_GNU_SOURCE -I. \"$RUNNER_TEMP/native-cost.c\" \"$RUNNER_TEMP/$arm/libqjs.a\" -lm -ldl -pthread -o \"$RUNNER_TEMP/$arm-cost\"\ndone\nnode \"$RUNNER_TEMP/cost-runner.mjs\" native\n"
        }
      ]
    },
    "sanitizers": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "run": "set -euo pipefail\ncmake -S . -B \"$RUNNER_TEMP/build\" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQJS_ENABLE_ASAN=ON -DQJS_ENABLE_UBSAN=ON\ncmake --build \"$RUNNER_TEMP/build\" -j2\n\"$RUNNER_TEMP/build/api-test\"\n\"$RUNNER_TEMP/build/run-test262\" -c tests.conf\necho ADOPTION_SANITIZED_PASS\n",
          "shell": "bash"
        }
      ]
    },
    "wasi": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "9dd7327",
            "fetch-depth": 16,
            "path": "ng-source"
          }
        },
        {
          "name": "Extract only native production layers",
          "shell": "bash",
          "run": "set -euo pipefail\ngit -C ng-source diff d7215b0ad3fc2c562e8317fd9bca058fd4863804 678c0404f70613129059bd17d1c847ab9b5c2590 -- quickjs.c > \"$RUNNER_TEMP/parent.patch\"\ngit -C ng-source diff 678c0404f70613129059bd17d1c847ab9b5c2590 9dd7327 -- quickjs.c > \"$RUNNER_TEMP/reserved.patch\"\nsha256sum \"$RUNNER_TEMP/\"*.patch\n"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "vincentkoc/quickjs-wasi",
            "ref": "feb11a3da64e22f5774fc2cb6d6c6372b364e9ba",
            "path": "wasi",
            "submodules": "recursive"
          }
        },
        {
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "10.30.3"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1",
            "cache": "pnpm",
            "cache-dependency-path": "wasi/pnpm-lock.yaml"
          }
        },
        {
          "name": "Build and test matched pinned WASI pair",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\ntest \"$(git -C quickjs-ng rev-parse HEAD)\" = 6d46d07d04041b40f4f49eaa7fdebe44c314c699\npnpm install --frozen-lockfile\nmake setup\ngit -C quickjs-ng apply --check \"$RUNNER_TEMP/parent.patch\"\ngit -C quickjs-ng apply \"$RUNNER_TEMP/parent.patch\"\nfor arm in baseline candidate; do\n  if [ \"$arm\" = candidate ]; then\n    git -C quickjs-ng apply --check \"$RUNNER_TEMP/reserved.patch\"\n    git -C quickjs-ng apply \"$RUNNER_TEMP/reserved.patch\"\n  fi\n  git -C quickjs-ng diff --check\n  pnpm run build\n  cp quickjs.wasm \"$RUNNER_TEMP/$arm.wasm\"\n  sha256sum quickjs.wasm dist/index.js\n  set +e\n  pnpm test --reporter=json --outputFile=\"$RUNNER_TEMP/$arm-suite.json\"\n  status=$?\n  set -e\n  ARM=\"$arm\" node --input-type=module <<'JS'\nimport {readFileSync} from 'node:fs';\nconst r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/'+process.env.ARM+'-suite.json'));\nconsole.log('SUB_WASI_SUITE',JSON.stringify({arm:process.env.ARM,passed:r.numPassedTests,failed:r.numFailedTests,files:r.testResults.length,failures:r.testResults.flatMap(x=>x.assertionResults).filter(x=>x.status==='failed').map(x=>({title:x.title,messages:x.failureMessages}))}));\nJS\n  echo \"suite-exit arm=$arm status=$status\"\ndone"
        },
        {
          "name": "Real allocator adoption and Deferred boundary",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/adoption-proof.mjs\" <<'JS'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {pathToFileURL} from 'node:url';import {resolve} from 'node:path';\nconst {QuickJS,JSException}=await import(pathToFileURL(resolve('wasi/dist/index.js'))),tmp=process.env.RUNNER_TEMP,rows=[];\nfor(const arm of ['baseline','candidate'])for(const api of ['raw','deferred']){\n const wasm=await WebAssembly.compile(readFileSync(tmp+'/'+arm+'.wasm'));\n using vm=await QuickJS.create({wasm,memoryLimit:16*1024*1024});\n void vm.undefined;void vm.true;let getterCalls=0,bodyCalls=0;\n using cap=vm.newFunction('cap',()=>{getterCalls++;vm._getExports().qjs_set_memory_limit(131073);return vm.undefined});\n using body=vm.newFunction('body',()=>{bodyCalls++;return vm.undefined});\n vm.global.setProp('cap',cap);vm.global.setProp('body',body);\n let d,source,resolver;\n if(api==='deferred'){d=vm.newPromise();source=d.handle;}\n else{using o=vm.evalCode('(()=>{let resolve;const promise=new Promise(r=>resolve=r);return {promise,resolve}})()');source=o.getProp('promise');resolver=o.getProp('resolve');}\n using thenable=vm.evalCode('(()=>{const then=r=>{body();r(true)};return {get then(){cap();return then}}})()');\n const observers=Array.from({length:128},()=>vm.promiseThenRaw(source,vm.undefined,vm.undefined));\n const memoryBefore=vm.getMemoryUsage();let caught;\n try{if(d)d.resolve(thenable);else vm.callFunction(resolver,vm.undefined,thenable).dispose();}catch(e){caught=e;}\n vm._getExports().qjs_set_memory_limit(16*1024*1024);\n if(caught){assert(caught instanceof JSException);caught.dispose();}\n using pending=vm.getException();const pendingType=vm._getExports().qjs_typeof(pending.ptr);\n const jobs=vm.executePendingJobs();\n const row={arm,api,cap:131073,subscribers:128,getterCalls,bodyCalls,caught:!!caught,pendingType,jobs,state:source.promiseState,memoryBefore};rows.push(row);\n assert.equal(getterCalls,1);assert.equal(bodyCalls,0);assert.equal(jobs,0);assert.equal(source.promiseState,0);\n if(arm==='candidate'&&api==='raw'){assert(caught);assert.equal(pendingType,4);}else{assert(!caught);assert.notEqual(pendingType,4);}\n for(const h of observers)h.dispose();resolver?.dispose();source.dispose();vm.unregisterHostCallback('cap');vm.unregisterHostCallback('body');vm.runGC();\n}\nconsole.log('ADOPTION_WASI_BOUNDARY',JSON.stringify(rows));\n\nJS\nnode \"$RUNNER_TEMP/adoption-proof.mjs\"\n"
        },
        {
          "name": "Matched WASI adoption cost",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/wasi-cost.mjs\" <<'JS'\nimport assert from 'node:assert/strict';import {readFileSync} from 'node:fs';import {pathToFileURL} from 'node:url';import {resolve} from 'node:path';import {createHash} from 'node:crypto';import {cpus,loadavg,freemem} from 'node:os';\nconst [dir,wasmPath,arm,pair]=process.argv.slice(2),{QuickJS}=await import(pathToFileURL(resolve(dir+'/index.js')));\nconst wasm=await WebAssembly.compile(readFileSync(wasmPath)),N=250,rows=[],hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex'),start={load:loadavg(),freeMemoryBytes:freemem()};\nfor(const kind of ['guest-adoption','async-return','async-resume','host-deferred','reaction-control']){\n using vm=await QuickJS.create({wasm,memoryLimit:32*1024*1024});void vm.undefined;void vm.true;\n using t=vm.evalCode('globalThis.calls=0;({then(r){++calls;r(true)}})');\n const expression=kind==='guest-adoption'?'Promise.resolve(t)':kind==='async-return'?'(async t=>t)(t)':kind==='async-resume'?'(async t=>{await 0;return t})(t)':'Promise.resolve(true).then(()=>{++calls})';\n using fn=vm.evalCode('t=>{globalThis.calls=0;for(let i=0;i<'+N+';i++){'+expression+'}}');\n using check=vm.evalCode('()=>calls');const samples=[];\n for(let round=-20;round<40;round++){\n  const handles=[];const cpu=process.cpuUsage(),at=performance.now();\n  if(kind==='host-deferred'){using reset=vm.evalCode('calls=0');for(let i=0;i<N;i++){const d=vm.newPromise();d.resolve(t);handles.push(d.handle)}}\n  else vm.callFunction(fn,vm.undefined,t).dispose();\n  const jobs=vm.executePendingJobs();for(const h of handles){assert.equal(h.promiseState,1);h.dispose()}\n  const wallMs=performance.now()-at,c=process.cpuUsage(cpu),cpuMs=(c.user+c.system)/1000;\n  assert.equal(jobs,N*(kind==='async-resume'?2:1));using count=vm.callFunction(check,vm.undefined);assert.equal(count.toNumber(),N);\n  using error=vm.getException();assert.equal(vm._getExports().qjs_typeof(error.ptr),4);\n  if(round>=0)samples.push({wallMs,cpuMs});\n }\n rows.push({kind,samples,memory:vm.getMemoryUsage(),wasmBytes:vm._getExports().memory.buffer.byteLength});\n}\nconsole.log(JSON.stringify({arm,pair:Number(pair),rows,n:N,warm:20,timed:40,probeSha256:hash(process.argv[1]),wasmSha256:hash(wasmPath),moduleSha256:hash(dir+'/index.js'),node:process.version,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},resourceUsage:process.resourceUsage()}));\n\nJS\ncat > \"$RUNNER_TEMP/cost-runner.mjs\" <<'JS'\nimport assert from 'node:assert/strict';\nimport {execFileSync} from 'node:child_process';\nimport {readFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport {cpus,loadavg,freemem} from 'node:os';\nconst mode=process.argv[2],tmp=process.env.RUNNER_TEMP,results=[];\nconst hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');\nfor(let pair=0;pair<5;pair++)for(const arm of pair%2?['candidate','baseline']:['baseline','candidate']){\n  const start={load:loadavg(),freeMemoryBytes:freemem()};\n  let r;\n  if(mode==='native'){\n    const exe=tmp+'/'+arm+'-cost';\n    r=JSON.parse(execFileSync(exe,[],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n    Object.assign(r,{arm,pair,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},executableSha256:hash(exe),probeSha256:hash(tmp+'/native-cost.c')});\n  }else r=JSON.parse(execFileSync(process.execPath,[tmp+'/wasi-cost.mjs','wasi/dist',tmp+'/'+arm+'.wasm',arm,String(pair)],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n  results.push(r);console.log('META_'+mode.toUpperCase()+'_RAW',JSON.stringify(r));\n}\nfor(const r of results){\n  assert.equal(r.probeSha256,results[0].probeSha256);\n  for(const row of r.rows){assert.equal(row.samples.length,40);for(const s of row.samples)assert(Number.isFinite(s.wallMs)&&s.wallMs>0&&Number.isFinite(s.cpuMs)&&s.cpuMs>0);}\n}\nconst median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)],p95=a=>[...a].sort((a,b)=>a-b)[Math.ceil(a.length*.95)-1];\nconsole.log('META_'+mode.toUpperCase()+'_SUMMARY',JSON.stringify(results[0].rows.map(row=>({kind:row.kind,pairs:Array.from({length:5},(_,pair)=>{\n  const arms=Object.fromEntries(results.filter(r=>r.pair===pair).map(r=>[r.arm,r.rows.find(x=>x.kind===row.kind).samples]));\n  const metrics=Object.fromEntries(Object.entries(arms).map(([arm,a])=>[arm,{wallMedianMs:median(a.map(s=>s.wallMs)),cpuMedianMs:median(a.map(s=>s.cpuMs)),wallP95Ms:p95(a.map(s=>s.wallMs)),earlyMedianMs:median(a.slice(0,10).map(s=>s.wallMs)),lateMedianMs:median(a.slice(-10).map(s=>s.wallMs))}]));\n  return{pair,arms:metrics,wallRatio:metrics.candidate.wallMedianMs/metrics.baseline.wallMedianMs,cpuRatio:metrics.candidate.cpuMedianMs/metrics.baseline.cpuMedianMs};\n})}))));\n\nJS\nnode \"$RUNNER_TEMP/cost-runner.mjs\" wasi\n"
        },
        {
          "name": "Require both full WASI suites",
          "shell": "bash",
          "run": "node --input-type=module <<'JS'\nimport assert from 'node:assert/strict';import {readFileSync} from 'node:fs';\nfor(const arm of ['baseline','candidate']){const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/'+arm+'-suite.json'));assert.equal(r.numFailedTests,0);assert.equal(r.numPassedTests,2050);}\nJS\n"
        }
      ]
    }
  }
}
