name: Checked function metadata qualification
on:
  push:
    branches: [ci/checked-function-metadata]
permissions:
  contents: read
jobs:
  final-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Release
            type: Release
            sanitize: 'OFF'
          - label: ASan-UBSan
            type: RelWithDebInfo
            sanitize: 'ON'
    name: Final native (${{ matrix.label }})
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71f3c615d6f44379583a2bffef90c0c66ec0b3dd
          fetch-depth: 4
      - name: Verify final source, API sweeps and existing tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 71f3c615d6f44379583a2bffef90c0c66ec0b3dd
          git diff d7215b0ad3fc2c562e8317fd9bca058fd4863804 HEAD -- quickjs.c | sha256sum
          cmake -S . -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE="${{ matrix.type }}" -DQJS_ENABLE_ASAN="${{ matrix.sanitize }}" -DQJS_ENABLE_UBSAN="${{ matrix.sanitize }}"
          cmake --build "$RUNNER_TEMP/build" -j2
          "$RUNNER_TEMP/build/api-test"
          "$RUNNER_TEMP/build/run-test262" -c tests.conf
          git diff --exit-code
          echo 'META_FINAL_PASS source=71f3c615d6f44379583a2bffef90c0c66ec0b3dd sweeps=17 trials=34816 prior-pending-controls=12'
