{
  "name": "Settled subscription WASI and cost",
  "on": {
    "push": {
      "branches": [
        "ci/settled-promise-subscription"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "d3c90857ccba4c47b39d023280726efa276e3098",
            "fetch-depth": 8
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1"
          }
        },
        {
          "name": "Matched frozen native production pair",
          "shell": "bash",
          "run": "set -euo pipefail\ncmake -S . -B \"$RUNNER_TEMP/candidate-build\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/candidate-build\" --target qjs -j2\ngit show 71f3c615d6f44379583a2bffef90c0c66ec0b3dd:quickjs.c > quickjs.c\ncmake -S . -B \"$RUNNER_TEMP/baseline-build\" -DCMAKE_BUILD_TYPE=Release\ncmake --build \"$RUNNER_TEMP/baseline-build\" --target qjs -j2\ngit restore --source=HEAD quickjs.c\ngit diff --exit-code"
        },
        {
          "name": "Subscription and generic enqueue cost",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/native-cost.c\" <<'C'\n#ifdef NDEBUG\n#undef NDEBUG\n#endif\n#include <assert.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <time.h>\n#include \"quickjs.h\"\n#define N 10000\nstatic JSValue values[N];\nstatic JSValue handler(JSContext *c, JSValueConst t, int n, JSValueConst *a) {\n    assert(n==1 && JS_IsSameValue(c,a[0],JS_TRUE));\n    ++*(int *)JS_GetContextOpaque(c);\n    return JS_TRUE;\n}\nstatic JSValue job(JSContext *c,int n,JSValueConst *a) {\n    assert(n==1 && JS_IsSameValue(c,a[0],JS_TRUE));\n    ++*(int *)JS_GetContextOpaque(c);\n    return JS_UNDEFINED;\n}\nstatic double clock_ms(clockid_t id) {\n    struct timespec t;assert(clock_gettime(id,&t)==0);\n    return t.tv_sec*1000.0+t.tv_nsec/1e6;\n}\nint main(void) {\n    const char *kinds[]={\"native-pending\",\"native-fulfilled\",\"native-rejected\",\"guest-fulfilled\",\"guest-rejected\",\"enqueue-job\"};\n    printf(\"{\\\"rows\\\":[\");\n    for(int kind=0;kind<6;kind++){\n        JSRuntime *rt=JS_NewRuntime();assert(rt);JS_SetDumpFlags(rt,JS_ABORT_ON_LEAKS);\n        JSContext *c=JS_NewContext(rt);assert(c);int calls=0;JS_SetContextOpaque(c,&calls);\n        JSValue fn=JS_NewCFunction(c,handler,\"handler\",1),source=JS_UNDEFINED,rs[2]={JS_UNDEFINED,JS_UNDEFINED},method=JS_UNDEFINED,arg=JS_TRUE;\n        if(kind>0&&kind<5){\n            source=JS_NewPromiseCapability(c,rs);assert(!JS_IsException(source));\n            JSValue v=JS_Call(c,rs[kind==2||kind==4],JS_UNDEFINED,1,&arg);assert(!JS_IsException(v));JS_FreeValue(c,v);\n            method=JS_GetPropertyStr(c,source,\"then\");assert(!JS_IsException(method));\n        }\n        printf(\"%s{\\\"kind\\\":\\\"%s\\\",\\\"samples\\\":[\",kind?\",\":\"\",kinds[kind]);\n        for(int round=-20;round<40;round++){\n            if(kind==0){source=JS_NewPromiseCapability(c,rs);assert(!JS_IsException(source));}\n            calls=0;\n            double cpu=clock_ms(CLOCK_PROCESS_CPUTIME_ID),at=clock_ms(CLOCK_MONOTONIC);\n            for(int i=0;i<N;i++){\n                if(kind==5)assert(JS_EnqueueJob(c,job,1,&arg)==0);\n                else if(kind>=3){JSValueConst args[]={fn,fn};values[i]=JS_Call(c,method,source,2,args);}\n                else values[i]=JS_PromiseThen(c,source,fn,fn);\n            }\n            double wall=clock_ms(CLOCK_MONOTONIC)-at;cpu=clock_ms(CLOCK_PROCESS_CPUTIME_ID)-cpu;\n            assert(!JS_HasException(c)&&calls==0);\n            for(int i=0;i<N&&kind<5;i++)assert(JS_PromiseState(c,values[i])==JS_PROMISE_PENDING);\n            if(kind==0){JSValue v=JS_Call(c,rs[0],JS_UNDEFINED,1,&arg);assert(!JS_IsException(v));JS_FreeValue(c,v);}\n            int jobs=0;JSContext *jc;\n            while(JS_IsJobPending(rt)){assert(JS_ExecutePendingJob(rt,&jc)>0);jobs++;}\n            assert(jobs==N&&calls==N&&!JS_HasException(c));\n            for(int i=0;i<N&&kind<5;i++){\n                assert(JS_PromiseState(c,values[i])==JS_PROMISE_FULFILLED);\n                JSValue v=JS_PromiseResult(c,values[i]);assert(JS_IsSameValue(c,v,JS_TRUE));JS_FreeValue(c,v);JS_FreeValue(c,values[i]);\n            }\n            if(kind==0){JS_FreeValue(c,source);for(int i=0;i<2;i++)JS_FreeValue(c,rs[i]);}\n            JS_RunGC(rt);assert(!JS_HasException(c));\n            if(round>=0)printf(\"%s{\\\"wallMs\\\":%.9f,\\\"cpuMs\\\":%.9f}\",round?\",\":\"\",wall,cpu);\n        }\n        printf(\"]}\");\n        if(kind>0&&kind<5){JS_FreeValue(c,source);for(int i=0;i<2;i++)JS_FreeValue(c,rs[i]);}\n        JS_FreeValue(c,method);JS_FreeValue(c,fn);JS_FreeContext(c);JS_RunGC(rt);\n        JSMemoryUsage usage;JS_ComputeMemoryUsage(rt,&usage);assert(usage.obj_count==0);JS_FreeRuntime(rt);\n    }\n    printf(\"],\\\"warmups\\\":20,\\\"rounds\\\":40,\\\"operationsPerBatch\\\":%d}\\n\",N);\n}\nC\ncat > \"$RUNNER_TEMP/cost-runner.mjs\" <<'JS'\nimport assert from 'node:assert/strict';\nimport {execFileSync} from 'node:child_process';\nimport {readFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport {cpus,loadavg,freemem} from 'node:os';\nconst mode=process.argv[2],tmp=process.env.RUNNER_TEMP,results=[];\nconst hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');\nfor(let pair=0;pair<5;pair++)for(const arm of pair%2?['candidate','baseline']:['baseline','candidate']){\n  const start={load:loadavg(),freeMemoryBytes:freemem()};\n  let r;\n  if(mode==='native'){\n    const exe=tmp+'/'+arm+'-cost';\n    r=JSON.parse(execFileSync(exe,[],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n    Object.assign(r,{arm,pair,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},executableSha256:hash(exe),probeSha256:hash(tmp+'/native-cost.c')});\n  }else r=JSON.parse(execFileSync(process.execPath,[tmp+'/wasi-cost.mjs','wasi/dist',tmp+'/'+arm+'.wasm',arm,String(pair)],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n  results.push(r);console.log('META_'+mode.toUpperCase()+'_RAW',JSON.stringify(r));\n}\nfor(const r of results){\n  assert.equal(r.probeSha256,results[0].probeSha256);\n  for(const row of r.rows){assert.equal(row.samples.length,40);for(const s of row.samples)assert(Number.isFinite(s.wallMs)&&s.wallMs>0&&Number.isFinite(s.cpuMs)&&s.cpuMs>0);}\n}\nconst median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)],p95=a=>[...a].sort((a,b)=>a-b)[Math.ceil(a.length*.95)-1];\nconsole.log('META_'+mode.toUpperCase()+'_SUMMARY',JSON.stringify(results[0].rows.map(row=>({kind:row.kind,pairs:Array.from({length:5},(_,pair)=>{\n  const arms=Object.fromEntries(results.filter(r=>r.pair===pair).map(r=>[r.arm,r.rows.find(x=>x.kind===row.kind).samples]));\n  const metrics=Object.fromEntries(Object.entries(arms).map(([arm,a])=>[arm,{wallMedianMs:median(a.map(s=>s.wallMs)),cpuMedianMs:median(a.map(s=>s.cpuMs)),wallP95Ms:p95(a.map(s=>s.wallMs)),earlyMedianMs:median(a.slice(0,10).map(s=>s.wallMs)),lateMedianMs:median(a.slice(-10).map(s=>s.wallMs))}]));\n  return{pair,arms:metrics,wallRatio:metrics.candidate.wallMedianMs/metrics.baseline.wallMedianMs,cpuRatio:metrics.candidate.cpuMedianMs/metrics.baseline.cpuMedianMs};\n})}))));\n\nJS\nfor arm in baseline candidate; do\n  cc -O3 -D_GNU_SOURCE -I. \"$RUNNER_TEMP/native-cost.c\" \"$RUNNER_TEMP/$arm-build/libqjs.a\" -lm -ldl -pthread -o \"$RUNNER_TEMP/$arm-cost\"\ndone\nnode \"$RUNNER_TEMP/cost-runner.mjs\" native"
        }
      ]
    },
    "wasi": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "d3c90857ccba4c47b39d023280726efa276e3098",
            "fetch-depth": 8,
            "path": "ng-source"
          }
        },
        {
          "name": "Extract only native production layers",
          "shell": "bash",
          "run": "set -euo pipefail\ngit -C ng-source diff d7215b0ad3fc2c562e8317fd9bca058fd4863804 71f3c615d6f44379583a2bffef90c0c66ec0b3dd -- quickjs.c > \"$RUNNER_TEMP/ng-metadata.patch\"\ngit -C ng-source diff 71f3c615d6f44379583a2bffef90c0c66ec0b3dd d3c90857ccba4c47b39d023280726efa276e3098 -- quickjs.c > \"$RUNNER_TEMP/ng-subscription.patch\"\ntest -s \"$RUNNER_TEMP/ng-subscription.patch\"\nsha256sum \"$RUNNER_TEMP/\"ng-*.patch"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "vincentkoc/quickjs-wasi",
            "ref": "feb11a3da64e22f5774fc2cb6d6c6372b364e9ba",
            "path": "wasi",
            "submodules": "recursive"
          }
        },
        {
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "10.30.3"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24.22.1",
            "cache": "pnpm",
            "cache-dependency-path": "wasi/pnpm-lock.yaml"
          }
        },
        {
          "name": "Build and test matched pinned WASI pair",
          "shell": "bash",
          "working-directory": "wasi",
          "run": "set -euo pipefail\ntest \"$(git -C quickjs-ng rev-parse HEAD)\" = 6d46d07d04041b40f4f49eaa7fdebe44c314c699\npnpm install --frozen-lockfile\nmake setup\ngit -C quickjs-ng apply --check \"$RUNNER_TEMP/ng-metadata.patch\"\ngit -C quickjs-ng apply \"$RUNNER_TEMP/ng-metadata.patch\"\nfor arm in baseline candidate; do\n  if [ \"$arm\" = candidate ]; then\n    git -C quickjs-ng apply --check \"$RUNNER_TEMP/ng-subscription.patch\"\n    git -C quickjs-ng apply \"$RUNNER_TEMP/ng-subscription.patch\"\n  fi\n  git -C quickjs-ng diff --check\n  pnpm run build\n  cp quickjs.wasm \"$RUNNER_TEMP/$arm.wasm\"\n  sha256sum quickjs.wasm dist/index.js\n  set +e\n  pnpm test --reporter=json --outputFile=\"$RUNNER_TEMP/$arm-suite.json\"\n  status=$?\n  set -e\n  ARM=\"$arm\" node --input-type=module <<'JS'\nimport {readFileSync} from 'node:fs';\nconst r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/'+process.env.ARM+'-suite.json'));\nconsole.log('SUB_WASI_SUITE',JSON.stringify({arm:process.env.ARM,passed:r.numPassedTests,failed:r.numFailedTests,files:r.testResults.length,failures:r.testResults.flatMap(x=>x.assertionResults).filter(x=>x.status==='failed').map(x=>({title:x.title,messages:x.failureMessages}))}));\nJS\n  test \"$status\" = 0\ndone"
        },
        {
          "name": "Public settled boundary and retry",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/subscription-boundary.mjs\" <<'JS'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {pathToFileURL} from 'node:url';\nimport {resolve} from 'node:path';\nconst root=resolve('wasi/dist'),tmp=process.env.RUNNER_TEMP;\nconst {QuickJS,JSException}=await import(pathToFileURL(resolve(root,'index.js')));\nconst ample=16*1024*1024;\nconst modules=Object.fromEntries(await Promise.all(['baseline','candidate'].map(async arm=>[arm,await WebAssembly.compile(readFileSync(tmp+'/'+arm+'.wasm'))])));\nlet trials=0,calibrations=0;\nfunction clear(vm) {using p=vm.getException();return vm._getExports().qjs_typeof(p.ptr);}\nfunction exception(e) {assert(e instanceof JSException);const r={name:e.name,message:e.message};e.dispose();return r;}\nasync function capture(arm,n) {\n using vm=await QuickJS.create({wasm:modules[arm],memoryLimit:ample});\n void vm.true;void vm.undefined;vm.getMemoryUsage();\n using source=vm.evalCode('Promise.resolve(true)');\n using handler=vm.evalCode('(value)=>{globalThis.fillerCalls++;return value}');\n vm.evalCode('globalThis.fillerCalls=0').dispose();\n for(let i=0;i<n;i++)vm.promiseThenRaw(source,handler,handler).dispose();\n return vm.snapshot();\n}\nasync function calibrate(snapshot,arm) {\n // A large string forces a backing allocation rather than using an arena slot.\n let lo=65536,hi=1024*1024;\n while(lo<hi){\n   const cap=Math.floor((lo+hi)/2);\n   using vm=await QuickJS.restore(snapshot,{wasm:modules[arm],memoryLimit:cap});\n   let ok=false;try{vm.newString('x'.repeat(65536)).dispose();ok=true;}catch(e){exception(e);}\n   calibrations++;\n   if(ok)hi=cap;else lo=cap+1;\n }\n return lo-65536;\n}\nasync function trial(arm,snapshot,operation,cap,n,check=false) {\n trials++;const events=[];\n using vm=await QuickJS.restore(snapshot,{wasm:modules[arm],memoryLimit:ample,onUnhandledRejection:(_p,_r,handled)=>events.push(handled)});\n void vm.true;void vm.undefined;vm.getMemoryUsage();\n const d=vm.newPromise();using handle=d.handle;d[operation](vm.true);\n const initial=vm.hostCallbacks.size;let p,error;\n vm._getExports().qjs_set_memory_limit(cap);\n try{p=d.settled;}catch(e){error=e;}\n // Only restore capacity after the operation and its native cleanup have returned.\n vm._getExports().qjs_set_memory_limit(ample);\n const caught=error?exception(error):null;\n const pending=clear(vm),callbacks=vm.hostCallbacks.size,eventsBefore=[...events];\n assert.equal(handle.promiseState,operation==='resolve'?1:2);\n let done=0;\n if(p){assert.equal(d.settled,p);p.then(()=>done++);}\n const jobs=vm.executePendingJobs();await Promise.resolve();\n const fillerCalls=vm.evalCode('fillerCalls').consume(v=>v.toNumber());\n assert.equal(fillerCalls,n);\n const witness=!!p&&pending!==4&&jobs===n&&done===0&&callbacks===initial+1;\n const row={arm,n,operation,cap,caught,pending,callbacks,initial,jobs,done,eventsBefore,eventsAfterDrain:[...events],witness};\n if(check){\n   assert(!p);assert.deepEqual(caught,{name:'InternalError',message:'out of memory'});\n   assert.equal(pending,4);assert.equal(callbacks,initial);assert.equal(jobs,n);\n   assert.deepEqual(eventsBefore,operation==='reject'?[false]:[]);\n   const retry=d.settled;assert.equal(d.settled,retry);retry.then(()=>done++);\n   assert.equal(vm.hostCallbacks.size,initial+1);\n   assert.equal(vm.executePendingJobs(),1);await Promise.resolve();\n   assert.equal(done,1);assert.equal(vm.executePendingJobs(),0);\n   assert.equal(vm.hostCallbacks.size,initial);\n   assert.deepEqual(events,operation==='reject'?[false,true]:[]);\n   assert.equal(clear(vm),4);\n   assert.equal(vm.evalCode('6*7').consume(v=>v.toNumber()),42);\n   row.retry={done,callbacks:vm.hostCallbacks.size,events:[...events]};\n }\n return row;\n}\nconst rows=[];\nfor(const operation of ['resolve','reject']){\n let fixture;\n for(let n=0;n<=96&&!fixture;n++){\n   const snapshot=await capture('baseline',n);\n   // Include the settled Deferred and its cached constants in the calibration layout.\n   let calibrated;\n   {using vm=await QuickJS.restore(snapshot,{wasm:modules.baseline,memoryLimit:ample});\n    const d=vm.newPromise();using h=d.handle;d[operation](vm.true);void vm.true;void vm.undefined;vm.getMemoryUsage();\n    calibrated=vm.snapshot();}\n   const floor=await calibrate(calibrated,'baseline');\n   for(const offset of [-4096,-2048,-1024,-256,0,64,256,1024,2048,3072,4096,6144,8192]){\n     const cap=floor+offset;if(cap<=131072)continue;\n     const r=await trial('baseline',snapshot,operation,cap,n);\n     if(r.witness){fixture={n,cap,floor};rows.push(r);break;}\n   }\n }\n console.log('SUB_WASI_SEARCH',JSON.stringify({operation,fixture,trials,calibrations}));\n assert(fixture,'bounded public-allocator search found no enqueue-stage fixture');\n const candidateSnapshot=await capture('candidate',fixture.n);\n rows.push(await trial('candidate',candidateSnapshot,operation,fixture.cap,fixture.n,true));\n}\nconsole.log('SUB_WASI_BOUNDARY',JSON.stringify({trials,calibrations,rows}));\n\nJS\nnode \"$RUNNER_TEMP/subscription-boundary.mjs\""
        },
        {
          "name": "Matched WASI subscription cost",
          "shell": "bash",
          "run": "set -euo pipefail\ncat > \"$RUNNER_TEMP/wasi-cost.mjs\" <<'JS'\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport {cpus,loadavg,freemem} from 'node:os';\nimport {pathToFileURL} from 'node:url';\nimport {resolve} from 'node:path';\nconst [root,wasmPath,arm,pair]=process.argv.slice(2);\nconst {QuickJS}=await import(pathToFileURL(resolve(root,'index.js')));\nconst bytes=readFileSync(wasmPath),wasm=await WebAssembly.compile(bytes);\nconst hash=b=>createHash('sha256').update(b).digest('hex'),env=()=>({load:loadavg(),freeMemoryBytes:freemem()});\nconst start=env(),rows=[],N=1000;\nfor(const kind of ['settled-pending','settled-fulfilled','settled-rejected','raw-fulfilled','raw-rejected']){\n using vm=await QuickJS.create({wasm,memoryLimit:64*1024*1024});\n void vm.true;void vm.undefined;\n let calls=0;using fn=vm.newFunction('handler',v=>{assert.equal(v.toBoolean(),true);calls++;return vm.true;});\n const owned=vm._ownedHandles.size,callbacks=vm.hostCallbacks.size,samples=[];\n let previousCount;\n for(let round=-20;round<40;round++){\n   const deferreds=Array.from({length:N},()=>vm.newPromise());\n   for(const d of deferreds)if(kind!=='settled-pending')d[kind.endsWith('rejected')?'reject':'resolve'](vm.true);\n   calls=0;let done=0;\n   const values=[],cpu=process.cpuUsage(),at=performance.now();\n   for(const d of deferreds)values.push(kind.startsWith('settled')?d.settled:vm.promiseThenRaw(d.handle,fn,fn));\n   const wallMs=performance.now()-at,elapsed=process.cpuUsage(cpu);\n   if(kind.startsWith('settled')){\n     for(let i=0;i<N;i++){assert.equal(deferreds[i].settled,values[i]);values[i].then(()=>done++);}\n     assert.equal(vm.hostCallbacks.size,callbacks+N);\n   }else for(const h of values)assert.equal(h.promiseState,0);\n   assert.equal(calls,0);assert.equal(done,0);\n   for(const d of deferreds)if(kind==='settled-pending')d.resolve(vm.true);\n   assert.equal(vm.executePendingJobs(),N);await Promise.resolve();\n   assert.equal(vm.executePendingJobs(),0);\n   if(kind.startsWith('settled'))assert.equal(done,N);\n   else{\n     assert.equal(calls,N);\n     for(const h of values){assert.equal(h.promiseState,1);h.dispose();}\n   }\n   for(const d of deferreds){\n     assert.equal(d.handle.promiseState,kind.endsWith('rejected')?2:1);\n     const result=await vm.resolvePromise(d.handle);\n     const value='value'in result?result.value:result.error;\n     assert.equal(value.consume(v=>v.toBoolean()),true);d.handle.dispose();\n   }\n   vm.runGC();assert.equal(vm._ownedHandles.size,owned);assert.equal(vm.hostCallbacks.size,callbacks);\n   using pending=vm.getException();assert.equal(vm._getExports().qjs_typeof(pending.ptr),4);\n   const count=vm.getMemoryUsage().objCount;\n   if(previousCount!==undefined)assert.equal(count,previousCount);\n   previousCount=count;\n   if(round>=0)samples.push({wallMs,cpuMs:(elapsed.user+elapsed.system)/1000});\n }\n rows.push({kind,samples});\n}\nconsole.log(JSON.stringify({arm,pair:Number(pair),rows,node:process.version,cpu:cpus()[0]?.model,start,end:env(),wasmSha256:hash(bytes),moduleSha256:hash(readFileSync(resolve(root,'index.js'))),probeSha256:hash(readFileSync(new URL(import.meta.url))),warmups:20,rounds:40,operationsPerBatch:N}));\n\nJS\ncat > \"$RUNNER_TEMP/cost-runner.mjs\" <<'JS'\nimport assert from 'node:assert/strict';\nimport {execFileSync} from 'node:child_process';\nimport {readFileSync} from 'node:fs';\nimport {createHash} from 'node:crypto';\nimport {cpus,loadavg,freemem} from 'node:os';\nconst mode=process.argv[2],tmp=process.env.RUNNER_TEMP,results=[];\nconst hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');\nfor(let pair=0;pair<5;pair++)for(const arm of pair%2?['candidate','baseline']:['baseline','candidate']){\n  const start={load:loadavg(),freeMemoryBytes:freemem()};\n  let r;\n  if(mode==='native'){\n    const exe=tmp+'/'+arm+'-cost';\n    r=JSON.parse(execFileSync(exe,[],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n    Object.assign(r,{arm,pair,cpu:cpus()[0]?.model,start,end:{load:loadavg(),freeMemoryBytes:freemem()},executableSha256:hash(exe),probeSha256:hash(tmp+'/native-cost.c')});\n  }else r=JSON.parse(execFileSync(process.execPath,[tmp+'/wasi-cost.mjs','wasi/dist',tmp+'/'+arm+'.wasm',arm,String(pair)],{encoding:'utf8',timeout:300000,maxBuffer:1024*1024}));\n  results.push(r);console.log('META_'+mode.toUpperCase()+'_RAW',JSON.stringify(r));\n}\nfor(const r of results){\n  assert.equal(r.probeSha256,results[0].probeSha256);\n  for(const row of r.rows){assert.equal(row.samples.length,40);for(const s of row.samples)assert(Number.isFinite(s.wallMs)&&s.wallMs>0&&Number.isFinite(s.cpuMs)&&s.cpuMs>0);}\n}\nconst median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)],p95=a=>[...a].sort((a,b)=>a-b)[Math.ceil(a.length*.95)-1];\nconsole.log('META_'+mode.toUpperCase()+'_SUMMARY',JSON.stringify(results[0].rows.map(row=>({kind:row.kind,pairs:Array.from({length:5},(_,pair)=>{\n  const arms=Object.fromEntries(results.filter(r=>r.pair===pair).map(r=>[r.arm,r.rows.find(x=>x.kind===row.kind).samples]));\n  const metrics=Object.fromEntries(Object.entries(arms).map(([arm,a])=>[arm,{wallMedianMs:median(a.map(s=>s.wallMs)),cpuMedianMs:median(a.map(s=>s.cpuMs)),wallP95Ms:p95(a.map(s=>s.wallMs)),earlyMedianMs:median(a.slice(0,10).map(s=>s.wallMs)),lateMedianMs:median(a.slice(-10).map(s=>s.wallMs))}]));\n  return{pair,arms:metrics,wallRatio:metrics.candidate.wallMedianMs/metrics.baseline.wallMedianMs,cpuRatio:metrics.candidate.cpuMedianMs/metrics.baseline.cpuMedianMs};\n})}))));\n\nJS\nnode \"$RUNNER_TEMP/cost-runner.mjs\" wasi"
        }
      ]
    }
  }
}
